<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高精度文字起こしツール</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; padding: 10px; box-sizing: border-box; gap: 8px; background: #f4f4f9; }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .area { flex-grow: 1; overflow-y: auto; background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 8px; white-space: pre-wrap; line-height: 1.6; }
        #final-text { font-size: 1.1em; color: #222; }
        #interim-text { font-size: 1em; color: #888; border-top: 1px dashed #ccc; height: 40px; margin-top: 5px; }
        .info-bar { font-size: 0.8em; color: #555; }
    </style>
</head>
<body>

    <div class="controls">
        <button id="start-btn">開始</button>
        <button id="stop-btn" disabled>停止</button>
        <button id="copy-btn">コピー</button>
        <button id="save-btn">保存</button>
        <select id="device-select"><option>デバイス確認中...</option></select>
        <label>感度: <input type="range" id="sensitivity" min="0" max="2" step="0.1" value="1"></label>
    </div>

    <div id="final-text" class="area"></div>
    <div id="interim-text" class="area"></div>
    <div id="status" class="info-bar">状態: 準備完了</div>

    <script>
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        let audioCtx, gainNode;

        recognition.lang = 'ja-JP';
        recognition.continuous = true;
        recognition.interimResults = true; // 即時性を向上させるため調整

        const finalDiv = document.getElementById('final-text');
        const interimDiv = document.getElementById('interim-text');
        const status = document.getElementById('status');

        // 音声感度調整のためのWeb Audio API初期化
        async function setupAudio() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioCtx = new AudioContext();
            const source = audioCtx.createMediaStreamSource(stream);
            gainNode = audioCtx.createGain();
            gainNode.gain.value = document.getElementById('sensitivity').value;
            source.connect(gainNode);
            // 実際に出力はしないが処理を介在させる
        }

        document.getElementById('sensitivity').oninput = (e) => {
            if (gainNode) gainNode.gain.value = e.target.value;
        };

        recognition.onresult = (event) => {
            let interim = '';
            let final = '';
            
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    let text = event.results[i][0].transcript.trim();
                    if (!text || /^[\s .。！？]+$/.test(text)) continue;
                    if (!/[。！？]$/.test(text)) text += '。';
                    final += text + '\n';
                } else {
                    interim += event.results[i][0].transcript;
                }
            }
            
            if (final) {
                finalDiv.innerText += final;
                finalDiv.scrollTop = finalDiv.scrollHeight;
            }
            interimDiv.innerText = interim;
        };

        recognition.onend = () => {
            if (!document.getElementById('stop-btn').disabled) {
                setTimeout(() => recognition.start(), 100); // 遅延を最小化
            }
        };

        document.getElementById('start-btn').onclick = async () => {
            await setupAudio();
            recognition.start();
            document.getElementById('start-btn').disabled = true;
            document.getElementById('stop-btn').disabled = false;
        };

        document.getElementById('stop-btn').onclick = () => {
            recognition.stop();
            document.getElementById('start-btn').disabled = false;
            document.getElementById('stop-btn').disabled = true;
        };

        document.getElementById('copy-btn').onclick = () => navigator.clipboard.writeText(finalDiv.innerText);
        
        document.getElementById('save-btn').onclick = () => {
            const blob = new Blob([finalDiv.innerText], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'transcript.txt';
            a.click();
        };
    </script>
</body>
</html>
