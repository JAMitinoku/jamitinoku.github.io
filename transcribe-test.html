<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>現場向け音声文字起こしシステム</title>
    <style>
        :root { --primary: #2e7d32; --danger: #c62828; --bg: #f5f5f5; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 10px; height: 100dvh; display: flex; flex-direction: column; }
        .container { max-width: 800px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; height: 100%; gap: 10px; }
        .status-panel { background: #fff; padding: 10px; border-radius: 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        #resultTextarea { flex: 1; width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; resize: none; outline: none; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 15px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .btn-start { background: var(--primary); }
        .btn-stop { background: var(--danger); }
        .secondary-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .btn-sub { background: #546e7a; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-panel">
            <span id="statusLabel">待機中</span>
            <span id="statusDot">●</span>
        </div>
        <textarea id="resultTextarea" placeholder="開始ボタンを押して話し始めてください..." readonly></textarea>
        <div class="controls">
            <button id="btnStart" class="btn-start">開始</button>
            <button id="btnStop" class="btn-stop" disabled>停止</button>
        </div>
        <div class="secondary-btns">
            <button class="btn-sub" onclick="copyText()">コピー</button>
            <button class="btn-sub" onclick="saveText()">保存</button>
            <button class="btn-sub" onclick="clearText()">消去</button>
        </div>
    </div>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isRunning = false;

    const textarea = document.getElementById('resultTextarea');
    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const statusLabel = document.getElementById('statusLabel');

    function initRecognition() {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (event) => {
            let final = "";
            let interim = "";
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) final += event.results[i][0].transcript + "。\n";
                else interim += event.results[i][0].transcript;
            }
            textarea.value += final;
            textarea.scrollTop = textarea.scrollHeight;
        };

        recognition.onend = () => {
            if (isRunning) recognition.start();
            else updateStatus("待機中", "#546e7a");
        };
    }

    function updateStatus(text, color) {
        statusLabel.innerText = text;
        document.getElementById('statusDot').style.color = color;
    }

    btnStart.onclick = () => {
        isRunning = true;
        initRecognition();
        recognition.start();
        btnStart.disabled = true;
        btnStop.disabled = false;
        updateStatus("録音中...", "#c62828");
    };

    btnStop.onclick = () => {
        isRunning = false;
        recognition.stop();
        btnStart.disabled = false;
        btnStop.disabled = true;
    };

    function copyText() { navigator.clipboard.writeText(textarea.value); alert("コピーしました"); }
    function clearText() { if(confirm("消去しますか？")) textarea.value = ""; }
    function saveText() {
        const blob = new Blob([textarea.value], {type: "text/plain"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "記録_" + new Date().toLocaleDateString() + ".txt";
        a.click();
    }
</script>
</body>
</html>
