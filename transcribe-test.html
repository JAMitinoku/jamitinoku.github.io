<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>超安定リアルタイム文字起こしツール (完成版)</title>
    <style>
        :root { --bg-color: #f1f3f5; --card-bg: #ffffff; --text-color: #212529; --border-color: #ced4da; --primary: #007bff; --success: #28a745; --danger: #dc3545; --secondary: #6c757d; }
        body, html { height: 100dvh; background-color: var(--bg-color); color: var(--text-color); margin: 0; display: flex; flex-direction: column; }
        .container { display: flex; flex-direction: column; height: 100%; padding: 10px; gap: 10px; }
        .status-header { background: var(--card-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        #resultTextarea { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 16px; resize: none; background: #fff; }
        .controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .sub-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        button { padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
        .btn-start { background: var(--success); }
        .btn-stop { background: var(--danger); }
        .btn-sub { background: var(--secondary); font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-header">
            <span id="statusText">待機中</span>
            <select id="boostSelect"><option value="1.0">等倍</option><option value="1.5">1.5倍</option><option value="2.0">2.0倍</option></select>
        </div>
        <textarea id="resultTextarea" readonly></textarea>
        <div class="controls">
            <button id="btnStart" class="btn-start">開始</button>
            <button id="btnStop" class="btn-stop" disabled>停止</button>
        </div>
        <div class="sub-controls">
            <button id="btnCopy" class="btn-sub">コピー</button>
            <button id="btnSave" class="btn-sub">保存</button>
            <button id="btnClear" class="btn-sub">消去</button>
        </div>
    </div>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition, isRunning = false;
    let finalizedLines = [];
    let lastText = "";
    
    const textarea = document.getElementById('resultTextarea');
    const statusText = document.getElementById('statusText');

    function initRecognition() {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (e) => {
            let interim = "";
            for (let i = e.resultIndex; i < e.results.length; ++i) {
                let text = e.results[i][0].transcript.trim();
                if (e.results[i].isFinal) {
                    if (text && text !== "。" && text !== lastText) {
                        finalizedLines.push(text + "。");
                        lastText = text;
                    }
                } else {
                    interim = text;
                }
            }
            textarea.value = finalizedLines.join("\n") + (interim ? "\n" + interim : "");
            textarea.scrollTop = textarea.scrollHeight;
        };

        recognition.onstart = () => { isRunning = true; statusText.innerText = "認識中..."; };
        recognition.onend = () => { if (isRunning) recognition.start(); else statusText.innerText = "待機中"; };
    }

    document.getElementById('btnStart').onclick = () => {
        if (!recognition) initRecognition();
        recognition.start();
        document.getElementById('btnStart').disabled = true;
        document.getElementById('btnStop').disabled = false;
    };

    document.getElementById('btnStop').onclick = () => {
        isRunning = false;
        recognition.stop();
        document.getElementById('btnStart').disabled = false;
        document.getElementById('btnStop').disabled = true;
    };

    document.getElementById('btnClear').onclick = () => {
        if(confirm("消去しますか？")) { finalizedLines = []; lastText = ""; textarea.value = ""; }
    };

    document.getElementById('btnCopy').onclick = () => navigator.clipboard.writeText(textarea.value);
    document.getElementById('btnSave').onclick = () => {
        const blob = new Blob([textarea.value], {type: "text/plain"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "記録.txt";
        a.click();
    };
</script>
</body>
</html>
