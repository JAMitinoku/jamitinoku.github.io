<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>文字起こしツール（デバイス表示機能付き）</title>
    <style>
        :root { --bg-color: #f1f3f5; --card-bg: #ffffff; --text-color: #212529; --border-color: #ced4da; --success: #28a745; --danger: #dc3545; --secondary: #6c757d; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body, html { height: 100dvh; background-color: var(--bg-color); overflow: hidden; }
        .container { display: flex; flex-direction: column; height: 100%; max-width: 900px; margin: 0 auto; padding: 10px; gap: 10px; }
        .info-bar { font-size: 0.8rem; background: #e9ecef; padding: 5px 10px; border-radius: 4px; color: #495057; display: flex; justify-content: space-between; }
        .header { display: flex; gap: 10px; align-items: center; }
        .status-badge { padding: 5px 10px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; background: #e9ecef; }
        #resultTextarea { flex: 1; width: 100%; padding: 15px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; resize: none; background: var(--card-bg); outline: none; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .sub-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        button { padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
        .btn-start { background-color: var(--success); }
        .btn-stop { background-color: var(--danger); }
        .btn-sub { background-color: var(--secondary); font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="info-bar">
            <span id="deviceName">入力: 取得中...</span>
        </div>
        <div class="header">
            <div id="statusBadge" class="status-badge">待機中</div>
        </div>
        <textarea id="resultTextarea" readonly placeholder="ここに文字起こしが表示されます..."></textarea>
        <div class="controls">
            <button id="btnStart" class="btn-start">開始</button>
            <button id="btnStop" class="btn-stop" disabled>停止</button>
        </div>
        <div class="sub-controls">
            <button id="btnCopy" class="btn-sub">コピー</button>
            <button id="btnSave" class="btn-sub">保存</button>
            <button id="btnClear" class="btn-sub">消去</button>
        </div>
    </div>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isUserStopping = false;

    async function updateDeviceName() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const track = stream.getAudioTracks()[0];
            document.getElementById('deviceName').innerText = "入力: " + track.label;
            stream.getTracks().forEach(t => t.stop());
        } catch (e) {
            document.getElementById('deviceName').innerText = "入力: 取得不可";
        }
    }
    updateDeviceName();

    function initRecognition() {
        if (recognition) { recognition.stop(); }
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (e) => {
            // 前回の履歴配列管理をやめ、新しく確定したテキストのみを追記する
            for (let i = e.resultIndex; i < e.results.length; i++) {
                if (e.results[i].isFinal) {
                    let text = e.results[i][0].transcript.trim();
                    if (text) {
                        if (!/[。！？]$/.test(text)) text += "。";
                        document.getElementById('resultTextarea').value += text + "\n";
                    }
                }
            }
            document.getElementById('resultTextarea').scrollTop = document.getElementById('resultTextarea').scrollHeight;
        };

        recognition.onstart = () => { document.getElementById('statusBadge').innerText = "認識中"; };
        recognition.onend = () => {
            if (!isUserStopping) {
                try { recognition.start(); } catch(e) {}
            } else {
                document.getElementById('statusBadge').innerText = "待機中";
            }
        };
    }

    document.getElementById('btnStart').onclick = () => {
        isUserStopping = false;
        initRecognition();
        recognition.start();
        document.getElementById('btnStart').disabled = true;
        document.getElementById('btnStop').disabled = false;
    };

    document.getElementById('btnStop').onclick = () => {
        isUserStopping = true;
        recognition.stop();
        document.getElementById('btnStart').disabled = false;
        document.getElementById('btnStop').disabled = true;
    };

    document.getElementById('btnClear').onclick = () => { document.getElementById('resultTextarea').value = ""; };
    document.getElementById('btnCopy').onclick = () => { 
        navigator.clipboard.writeText(document.getElementById('resultTextarea').value);
        alert("コピーしました"); 
    };
</script>
</body>
</html>
