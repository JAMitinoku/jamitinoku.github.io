<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>超安定リアルタイム文字起こしツール</title>
    <style>
        :root { --bg-color: #f1f3f5; --card-bg: #ffffff; --text-color: #212529; --border-color: #ced4da; --primary: #007bff; --success: #28a745; --danger: #dc3545; --secondary: #6c757d; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body, html { height: 100dvh; background-color: var(--bg-color); }
        .container { display: flex; flex-direction: column; height: 100%; max-width: 900px; margin: 0 auto; padding: 10px; gap: 10px; }
        .status-header { background: var(--card-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        #resultTextarea { flex: 1; width: 100%; padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 16px; resize: none; background: #fff; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .sub-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        button { padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
        .btn-start { background: var(--success); }
        .btn-stop { background: var(--danger); }
        .btn-sub { background: var(--secondary); font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-header">
            <span id="statusText">待機中</span>
            <select id="boostSelect"><option value="1.0">等倍</option><option value="1.5">1.5倍</option><option value="2.0">2.0倍</option></select>
        </div>
        <textarea id="resultTextarea" readonly></textarea>
        <div class="controls">
            <button id="btnStart" class="btn-start">開始</button>
            <button id="btnStop" class="btn-stop" disabled>停止</button>
        </div>
        <div class="sub-controls">
            <button id="btnCopy" class="btn-sub">コピー</button>
            <button id="btnSave" class="btn-sub">保存</button>
            <button id="btnClear" class="btn-sub">消去</button>
        </div>
    </div>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isRunning = false;
    let finalizedLog = []; // 確定文を強固に守るためのログ配列

    const textarea = document.getElementById('resultTextarea');
    const statusText = document.getElementById('statusText');

    function initRecognition() {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (e) => {
            let interimText = "";
            let newFinals = [];

            // すべての履歴を再走査し、確定文と未確定文を抽出
            for (let i = 0; i < e.results.length; i++) {
                if (e.results[i].isFinal) {
                    let transcript = e.results[i][0].transcript.trim();
                    if (transcript) newFinals.push(transcript);
                } else {
                    interimText = e.results[i][0].transcript.trim();
                }
            }

            // 確定文を配列に反映（重複させない）
            newFinals.forEach(text => {
                if (!finalizedLog.includes(text)) {
                    finalizedLog.push(text);
                }
            });

            // 表示更新：配列内の確定文 ＋ 現在の未確定文
            textarea.value = finalizedLog.join("\n") + (interimText ? "\n" + interimText : "");
            textarea.scrollTop = textarea.scrollHeight;
        };

        recognition.onstart = () => { isRunning = true; statusText.innerText = "認識中..."; };
        recognition.onend = () => {
            if (isRunning) recognition.start();
            else statusText.innerText = "待機中";
        };
    }

    document.getElementById('btnStart').onclick = () => {
        if (!recognition) initRecognition();
        recognition.start();
        document.getElementById('btnStart').disabled = true;
        document.getElementById('btnStop').disabled = false;
    };

    document.getElementById('btnStop').onclick = () => {
        isRunning = false;
        recognition.stop();
        document.getElementById('btnStart').disabled = false;
        document.getElementById('btnStop').disabled = true;
    };

    document.getElementById('btnClear').onclick = () => {
        if(confirm("消去しますか？")) { finalizedLog = []; textarea.value = ""; }
    };

    document.getElementById('btnCopy').onclick = () => navigator.clipboard.writeText(textarea.value);
    document.getElementById('btnSave').onclick = () => {
        const blob = new Blob([textarea.value], {type: "text/plain"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "記録_" + new Date().getTime() + ".txt";
        a.click();
    };
</script>
</body>
</html>
