<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>文字起こしツール</title>
    <style>
        :root { --bg-color: #f1f3f5; --card-bg: #ffffff; --text-color: #212529; --border-color: #ced4da; --success: #28a745; --danger: #dc3545; --secondary: #6c757d; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body, html { height: 100dvh; background-color: var(--bg-color); overflow: hidden; }
        .container { display: flex; flex-direction: column; height: 100%; max-width: 900px; margin: 0 auto; padding: 10px; gap: 10px; }
        .info-bar { font-size: 0.8rem; background: #e9ecef; padding: 5px 10px; border-radius: 4px; color: #495057; display: flex; flex-direction: column; gap: 5px; }
        .config-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        select { flex: 1; padding: 2px; border-radius: 4px; border: 1px solid var(--border-color); }
        .header { display: flex; gap: 10px; align-items: center; }
        .status-badge { padding: 5px 10px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; background: #e9ecef; }
        #resultTextarea { flex: 1; width: 100%; padding: 15px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; resize: none; background: var(--card-bg); outline: none; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .sub-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        button { padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
        .btn-start { background-color: var(--success); }
        .btn-stop { background-color: var(--danger); }
        .btn-sub { background-color: var(--secondary); font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="info-bar">
            <div class="config-row">
                <span>入力:</span>
                <select id="deviceSelect"><option>取得中...</option></select>
            </div>
            <div class="config-row">
                <span>感度:</span>
                <select id="gainSelect">
                    <option value="1">標準</option>
                    <option value="2">高感度</option>
                    <option value="3">最大</option>
                </select>
            </div>
        </div>
        <div class="header">
            <div id="statusBadge" class="status-badge">待機中</div>
        </div>
        <textarea id="resultTextarea" readonly placeholder="認識結果..."></textarea>
        <div class="controls">
            <button id="btnStart" class="btn-start">開始</button>
            <button id="btnStop" class="btn-stop" disabled>停止</button>
        </div>
        <div class="sub-controls">
            <button id="btnCopy" class="btn-sub">コピー</button>
            <button id="btnSave" class="btn-sub">保存</button>
            <button id="btnClear" class="btn-sub">消去</button>
        </div>
    </div>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isUserStopping = false;

    // デバイス取得（変更なし）
    async function refreshDeviceList() {
        try {
            await navigator.mediaDevices.getUserMedia({ audio: true });
            const devices = await navigator.mediaDevices.enumerateDevices();
            const audioDevices = devices.filter(d => d.kind === 'audioinput');
            const select = document.getElementById('deviceSelect');
            select.innerHTML = '';
            audioDevices.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.deviceId;
                opt.text = d.label || `マイク ${select.length + 1}`;
                select.appendChild(opt);
            });
        } catch (e) { document.getElementById('deviceSelect').innerHTML = '<option>取得不可</option>'; }
    }

    function initRecognition() {
        if (recognition) recognition.stop();
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.continuous = true;
        recognition.interimResults = true;
        
        recognition.onresult = (e) => {
            let interimText = "";
            let finalOutput = "";

            // ★ここがダブリ解消の心臓部
            // 過去のループを捨て、e.resultIndexから始まる「今回確定したデータのみ」を処理する
            for (let i = e.resultIndex; i < e.results.length; i++) {
                if (e.results[i].isFinal) {
                    let text = e.results[i][0].transcript.trim();
                    if (text) {
                        if (!/[。！？]$/.test(text)) text += "。";
                        document.getElementById('resultTextarea').value += text + "\n";
                    }
                } else {
                    interimText = e.results[i][0].transcript.trim();
                }
            }
            
            // 認識中の文字を表示するため、textareaの末尾に編集中テキストを一時的にくっつける
            const baseText = document.getElementById('resultTextarea').value.split('\n').filter(l => l).join('\n');
            // 確定分以外の「編集中」の表示（簡易更新）
            const area = document.getElementById('resultTextarea');
            if (interimText) {
                // UI上、確定済みリストの下に編集中テキストを一時表示（ダブらせない）
                area.value = baseText + (baseText ? "\n" : "") + interimText;
            } else {
                area.value = baseText;
            }
            area.scrollTop = area.scrollHeight;
        };

        recognition.onstart = () => { document.getElementById('statusBadge').innerText = "認識中"; };
        recognition.onend = () => {
            if (!isUserStopping) { try { recognition.start(); } catch(e) {} }
            else { document.getElementById('statusBadge').innerText = "待機中"; }
        };
    }

    document.getElementById('btnStart').onclick = () => {
        isUserStopping = false;
        initRecognition();
        recognition.start();
        document.getElementById('btnStart').disabled = true;
        document.getElementById('btnStop').disabled = false;
    };

    document.getElementById('btnStop').onclick = () => {
        isUserStopping = true;
        recognition.stop();
        document.getElementById('btnStart').disabled = false;
        document.getElementById('btnStop').disabled = true;
    };

    document.getElementById('btnClear').onclick = () => document.getElementById('resultTextarea').value = "";
    document.getElementById('btnCopy').onclick = () => navigator.clipboard.writeText(document.getElementById('resultTextarea').value);

    refreshDeviceList();
</script>
</body>
</html>
