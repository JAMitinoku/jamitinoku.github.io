<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高精度文字起こしツール</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; padding: 10px; gap: 8px; background: #f4f4f9; }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .area { flex-grow: 1; overflow-y: auto; background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 8px; white-space: pre-wrap; line-height: 1.6; }
        #final-text { font-size: 1.1em; color: #222; }
        #interim-text { font-size: 1em; color: #888; border-top: 1px dashed #ccc; min-height: 40px; margin-top: 5px; font-style: italic; }
        .info-bar { font-size: 0.8em; color: #555; padding: 5px; }
        button { padding: 8px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
        button:disabled { background: #eee; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="controls">
        <button id="start-btn">開始</button>
        <button id="stop-btn" disabled>停止</button>
        <button id="copy-btn">コピー</button>
        <button id="save-btn">保存</button>
        <button id="clear-btn">クリア</button>
        <button id="reset-btn">リセット</button>
        <select id="device-select"><option>マイク選択...</option></select>
        <label>感度: <input type="range" id="sensitivity" min="0.1" max="2.0" step="0.1" value="1.0"></label>
    </div>

    <div id="final-text" class="area"></div>
    <div id="interim-text" class="area"></div>
    <div id="status" class="info-bar">状態: 準備完了</div>

    <script>
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        let audioCtx, gainNode;

        recognition.lang = 'ja-JP';
        recognition.continuous = true;
        recognition.interimResults = true;

        // デバイス初期化
        navigator.mediaDevices.enumerateDevices().then(devices => {
            const select = document.getElementById('device-select');
            devices.filter(d => d.kind === 'audioinput').forEach(d => {
                let opt = document.createElement('option');
                opt.value = d.deviceId;
                opt.text = d.label || 'マイク';
                select.add(opt);
            });
        });

        // 感度調整用オーディオ設定
        async function setupAudio() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: document.getElementById('device-select').value || undefined } });
            audioCtx = new AudioContext();
            const source = audioCtx.createMediaStreamSource(stream);
            gainNode = audioCtx.createGain();
            gainNode.gain.value = document.getElementById('sensitivity').value;
            source.connect(gainNode);
        }

        document.getElementById('sensitivity').oninput = (e) => { if (gainNode) gainNode.gain.value = e.target.value; };

        // 認識ロジック
        recognition.onresult = (event) => {
            let final = '';
            let interim = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    let text = event.results[i][0].transcript.trim();
                    if (text && !/^[\s .。！？]+$/.test(text)) {
                        if (!/[。！？]$/.test(text)) text += '。';
                        final += text + '\n';
                    }
                } else {
                    interim += event.results[i][0].transcript;
                }
            }
            if (final) {
                document.getElementById('final-text').innerText += final;
                document.getElementById('final-text').scrollTop = document.getElementById('final-text').scrollHeight;
            }
            document.getElementById('interim-text').innerText = interim;
        };

        recognition.onend = () => {
            if (!document.getElementById('stop-btn').disabled) {
                setTimeout(() => recognition.start(), 100);
            }
        };

        document.getElementById('start-btn').onclick = async () => {
            await setupAudio();
            recognition.start();
            document.getElementById('start-btn').disabled = true;
            document.getElementById('stop-btn').disabled = false;
            document.getElementById('status').innerText = "状態: 認識中...";
        };

        document.getElementById('stop-btn').onclick = () => {
            recognition.stop();
            document.getElementById('start-btn').disabled = false;
            document.getElementById('stop-btn').disabled = true;
            document.getElementById('status').innerText = "状態: 停止";
        };

        document.getElementById('clear-btn').onclick = () => { document.getElementById('final-text').innerText = ''; document.getElementById('interim-text').innerText = ''; };
        document.getElementById('copy-btn').onclick = () => navigator.clipboard.writeText(document.getElementById('final-text').innerText);
        document.getElementById('save-btn').onclick = () => {
            const blob = new Blob([document.getElementById('final-text').innerText], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'transcript.txt';
            a.click();
        };
        document.getElementById('reset-btn').onclick = () => location.reload();
    </script>
</body>
</html>
