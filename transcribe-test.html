<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字起こしツール</title>
    <style>
        :root { --primary-bg: #f0f2f5; --panel-bg: #ffffff; --border-color: #ccd6dd; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; padding: 10px; background: var(--primary-bg); gap: 10px; box-sizing: border-box; }
        .controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; background: var(--panel-bg); padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); }
        button { padding: 10px; cursor: pointer; border: 1px solid #ccc; border-radius: 6px; background: #fff; font-weight: bold; }
        button:active { background: #e0e0e0; }
        .area-container { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
        .area { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; overflow-y: auto; white-space: pre-wrap; line-height: 1.7; }
        #final-text { flex-grow: 2; font-size: 1.1em; }
        #interim-text { height: 60px; font-size: 1em; color: #666; font-style: italic; border: 1px dashed #aaa; }
        .status-bar { font-size: 0.85em; color: #555; padding: 5px; }
        select, input { padding: 8px; border-radius: 6px; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <div class="controls">
        <button id="start-btn">開始</button>
        <button id="stop-btn" disabled>停止</button>
        <button id="copy-btn">コピー</button>
        <button id="save-btn">保存</button>
        <button id="clear-btn">クリア</button>
        <button id="reset-btn">リセット</button>
        <select id="device-select"><option>マイク選択...</option></select>
        <label>感度: <input type="range" id="sensitivity" min="0.1" max="2.0" step="0.1" value="1.0"></label>
    </div>

    <div class="area-container">
        <div id="final-text" class="area"></div>
        <div id="interim-text" class="area"></div>
    </div>

    <div id="status" class="status-bar">状態: 準備完了</div>

    <script>
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.continuous = true;
        rec.interimResults = true;
        rec.lang = 'ja-JP';
        rec.maxAlternatives = 1; // 予測を1つに限定

        // デバイス読み込み
        navigator.mediaDevices.enumerateDevices().then(devices => {
            const select = document.getElementById('device-select');
            devices.filter(d => d.kind === 'audioinput').forEach(d => {
                let opt = document.createElement('option');
                opt.value = d.deviceId;
                opt.text = d.label || 'マイク';
                select.add(opt);
            });
        });

        // ロジック：余計な加工（句読点補完など）を排除し、生の出力を優先
        rec.onresult = (e) => {
            let final = "", interim = "";
            for (let i = e.resultIndex; i < e.results.length; i++) {
                if (e.results[i].isFinal) {
                    final += e.results[i][0].transcript;
                } else {
                    interim += e.results[i][0].transcript;
                }
            }
            if (final) {
                document.getElementById('final-text').innerText += final + "\n";
                document.getElementById('final-text').scrollTop = document.getElementById('final-text').scrollHeight;
            }
            document.getElementById('interim-text').innerText = interim;
        };

        rec.onend = () => { if(!document.getElementById('stop-btn').disabled) rec.start(); };
        
        document.getElementById('start-btn').onclick = () => { rec.start(); document.getElementById('start-btn').disabled = true; document.getElementById('stop-btn').disabled = false; };
        document.getElementById('stop-btn').onclick = () => { rec.stop(); document.getElementById('start-btn').disabled = false; document.getElementById('stop-btn').disabled = true; };
        document.getElementById('clear-btn').onclick = () => { document.getElementById('final-text').innerText = ''; };
        document.getElementById('reset-btn').onclick = () => location.reload();
        document.getElementById('copy-btn').onclick = () => navigator.clipboard.writeText(document.getElementById('final-text').innerText);
        document.getElementById('save-btn').onclick = () => {
            const blob = new Blob([document.getElementById('final-text').innerText], {type: 'text/plain'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'log.txt'; a.click();
        };
    </script>
</body>
</html>
