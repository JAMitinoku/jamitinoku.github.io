<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>現場向け音声文字起こし【完遂版】</title>
    <style>
        :root { --primary: #2e7d32; --danger: #c62828; --bg: #f5f5f5; --border: #ccc; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 10px; height: 100dvh; display: flex; flex-direction: column; }
        .container { max-width: 800px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; height: 100%; gap: 10px; }
        .panel { background: #fff; padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
        .status-bar { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; }
        .config-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        select { width: 100%; padding: 5px; border-radius: 4px; border: 1px solid var(--border); }
        #resultTextarea { flex: 1; width: 100%; padding: 15px; border-radius: 8px; border: 1px solid var(--border); font-size: 1rem; resize: none; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .btn-start { background: var(--primary); }
        .btn-stop { background: var(--danger); }
        .sub-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .btn-sub { background: #546e7a; font-size: 0.8rem; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel">
            <div class="status-bar">
                <span id="statusLabel">待機中</span>
                <span id="statusDot">●</span>
            </div>
            <div class="config-row">
                <select id="deviceSelect"><option value="">マイク選択</option></select>
                <select id="boostSelect">
                    <option value="1.0">等倍</option>
                    <option value="1.5">1.5倍ブースト</option>
                    <option value="2.0">2.0倍ブースト</option>
                </select>
            </div>
        </div>
        <textarea id="resultTextarea" placeholder="開始ボタンを押して話し始めてください..." readonly></textarea>
        <div class="controls">
            <button id="btnStart" class="btn-start">開始</button>
            <button id="btnStop" class="btn-stop" disabled>停止</button>
        </div>
        <div class="sub-grid">
            <button class="btn-sub" onclick="copyText()">コピー</button>
            <button class="btn-sub" onclick="saveText()">保存</button>
            <button class="btn-sub" onclick="clearText()">消去</button>
        </div>
    </div>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition, audioCtx, gainNode, stream, isRunning = false;
    let finalLines = []; // 確定行を管理
    const textarea = document.getElementById('resultTextarea');
    const statusLabel = document.getElementById('statusLabel');

    async function initDevices() {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const select = document.getElementById('deviceSelect');
            devices.forEach(d => {
                if(d.kind === 'audioinput') {
                    let opt = document.createElement('option');
                    opt.value = d.deviceId; opt.text = d.label || 'マイク';
                    select.appendChild(opt);
                }
            });
        } catch(e) {}
    }

    async function setupAudio() {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: document.getElementById('deviceSelect').value || true } });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let source = audioCtx.createMediaStreamSource(stream);
        gainNode = audioCtx.createGain();
        gainNode.gain.value = parseFloat(document.getElementById('boostSelect').value);
        source.connect(gainNode);
    }

    function initRecognition() {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (e) => {
            let interim = "";
            for (let i = e.resultIndex; i < e.results.length; ++i) {
                let segment = e.results[i][0].transcript.trim();
                if (e.results[i].isFinal) {
                    // 重複チェックと空行除外
                    if (segment && segment !== "。" && segment !== finalLines[finalLines.length - 1]) {
                        finalLines.push(segment + "。");
                    }
                } else {
                    interim = segment;
                }
            }
            // 表示の更新：確定分＋未確定分
            textarea.value = finalLines.join("\n") + (interim ? "\n" + interim : "");
            textarea.scrollTop = textarea.scrollHeight;
        };

        recognition.onstart = () => statusLabel.innerText = "認識中...";
        recognition.onend = () => { if (isRunning) recognition.start(); else statusLabel.innerText = "待機中"; };
    }

    document.getElementById('btnStart').onclick = async () => {
        isRunning = true;
        await setupAudio();
        initRecognition();
        recognition.start();
        document.getElementById('btnStart').disabled = true;
        document.getElementById('btnStop').disabled = false;
    };

    document.getElementById('btnStop').onclick = () => {
        isRunning = false;
        recognition.stop();
        if(stream) stream.getTracks().forEach(t => t.stop());
        if(audioCtx) audioCtx.close();
        document.getElementById('btnStart').disabled = false;
        document.getElementById('btnStop').disabled = true;
        statusLabel.innerText = "待機中";
    };

    function copyText() { navigator.clipboard.writeText(textarea.value); }
    function clearText() { if(confirm("消去しますか？")) { finalLines = []; textarea.value = ""; } }
    function saveText() {
        const blob = new Blob([textarea.value], {type: "text/plain"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "記録_" + new Date().toLocaleDateString() + ".txt";
        a.click();
    }
    initDevices();
</script>
</body>
</html>
