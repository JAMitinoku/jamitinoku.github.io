<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>超安定リアルタイム文字起こしツール (修正完成版)</title>
    <style>
        :root { --bg-color: #f1f3f5; --card-bg: #ffffff; --text-color: #212529; --border-color: #ced4da; --success: #28a745; --danger: #dc3545; }
        body, html { height: 100dvh; background-color: var(--bg-color); margin: 0; padding: 10px; box-sizing: border-box; }
        .container { display: flex; flex-direction: column; height: 100%; gap: 10px; }
        .status-panel { background: var(--card-bg); padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        #resultTextarea { flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px; resize: none; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .sub-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        button { padding: 15px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="status-panel">
        <span id="statusText">待機中</span>
        <select id="boostSelect"><option value="1">等倍</option><option value="1.5">1.5倍</option><option value="2">2.0倍</option></select>
    </div>
    <textarea id="resultTextarea" readonly></textarea>
    <div class="controls">
        <button id="btnStart" style="background:var(--success)">開始</button>
        <button id="btnStop" style="background:var(--danger)" disabled>停止</button>
    </div>
    <div class="sub-controls">
        <button id="btnCopy" style="background:#6c757d">コピー</button>
        <button id="btnSave" style="background:#6c757d">保存</button>
        <button id="btnClear" style="background:#6c757d">消去</button>
    </div>
</div>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition, isRunning = false;
    let finalizedBuffer = ""; // 確定済みテキストの累積バッファ
    let lastFinal = ""; // 重複防止用

    const textarea = document.getElementById('resultTextarea');
    const statusText = document.getElementById('statusText');

    function initRecognition() {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (e) => {
            let interim = "";
            let final = "";
            
            for (let i = e.resultIndex; i < e.results.length; ++i) {
                let segment = e.results[i][0].transcript.trim();
                if (e.results[i].isFinal) {
                    // 重複除去と「。」の正規化：末尾の句点を一度削除してから「。」を1つ付与
                    let cleanSegment = segment.replace(/。+$/, '');
                    if (cleanSegment && cleanSegment !== lastFinal) {
                        final += cleanSegment + "。\n";
                        lastFinal = cleanSegment;
                    }
                } else {
                    interim += segment;
                }
            }
            if (final) finalizedBuffer += final;
            textarea.value = finalizedBuffer + interim;
            textarea.scrollTop = textarea.scrollHeight;
        };

        recognition.onstart = () => { isRunning = true; statusText.innerText = "認識中..."; };
        recognition.onend = () => { if (isRunning) recognition.start(); else statusText.innerText = "待機中"; };
    }

    document.getElementById('btnStart').onclick = () => {
        initRecognition();
        recognition.start();
        document.getElementById('btnStart').disabled = true;
        document.getElementById('btnStop').disabled = false;
    };

    document.getElementById('btnStop').onclick = () => {
        isRunning = false;
        recognition.stop();
        document.getElementById('btnStart').disabled = false;
        document.getElementById('btnStop').disabled = true;
    };

    document.getElementById('btnClear').onclick = () => {
        finalizedBuffer = ""; lastFinal = ""; textarea.value = "";
    };
    
    // コピー・保存処理は元の仕様を継承
    document.getElementById('btnCopy').onclick = () => navigator.clipboard.writeText(textarea.value);
</script>
</body>
</html>
