<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>超安定リアルタイム文字起こしツール (マイクブースト版)</title>
    <style>
        :root {
            --bg-color: #f1f3f5; --card-bg: #ffffff; --text-color: #212529; --border-color: #ced4da;
            --primary: #007bff; --success: #28a745; --danger: #dc3545; --secondary: #6c757d; --accent: #e9ecef;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { height: 100dvh; background-color: var(--bg-color); }
        .container { display: flex; flex-direction: column; height: 100%; max-width: 900px; margin: 0 auto; padding: 10px; gap: 10px; }
        .status-header { background: var(--card-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        #resultTextarea { flex: 1; width: 100%; padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 16px; resize: none; background: #fff; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .sub-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        button { padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
        .btn-start { background: var(--success); }
        .btn-stop { background: var(--danger); }
        .btn-sub { background: var(--secondary); font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="status-header">
        <span id="statusText">待機中</span>
        <select id="boostSelect"><option value="1.0">等倍</option><option value="1.5">1.5倍</option><option value="2.0">2.0倍</option></select>
    </div>
    <textarea id="resultTextarea" readonly></textarea>
    <div class="controls">
        <button id="btnStart" class="btn-start">開始</button>
        <button id="btnStop" class="btn-stop" disabled>停止</button>
    </div>
    <div class="sub-controls">
        <button id="btnCopy" class="btn-sub">コピー</button>
        <button id="btnSave" class="btn-sub">保存</button>
        <button id="btnClear" class="btn-sub">消去</button>
    </div>
</div>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let finalizedLines = []; // 確定文を管理する配列

    const textarea = document.getElementById('resultTextarea');
    const statusText = document.getElementById('statusText');

    function initRecognition() {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (e) => {
            let interim = "";
            for (let i = e.resultIndex; i < e.results.length; ++i) {
                let text = e.results[i][0].transcript.trim();
                
                if (e.results[i].isFinal) {
                    // 「。」だけの行、空行を無視し、直前の確定文と同じならスキップ
                    if (text && text !== "。" && text !== finalizedLines[finalizedLines.length - 1]) {
                        // 文末にすでに「。」があれば付与しない
                        let line = text.endsWith('。') ? text : (text + '。');
                        finalizedLines.push(line);
                    }
                } else {
                    interim = text;
                }
            }
            // 表示の更新
            textarea.value = finalizedLines.join("\n") + (interim ? "\n" + interim : "");
            textarea.scrollTop = textarea.scrollHeight;
        };

        recognition.onstart = () => statusText.innerText = "認識中...";
        recognition.onend = () => { statusText.innerText = "待機中"; };
    }

    document.getElementById('btnStart').onclick = () => {
        if (!recognition) initRecognition();
        recognition.start();
        document.getElementById('btnStart').disabled = true;
        document.getElementById('btnStop').disabled = false;
    };

    document.getElementById('btnStop').onclick = () => {
        recognition.stop();
        document.getElementById('btnStart').disabled = false;
        document.getElementById('btnStop').disabled = true;
    };

    document.getElementById('btnClear').onclick = () => {
        finalizedLines = [];
        textarea.value = "";
    };
    
    // 他のボタン（コピー・保存）は元の処理を継承してください
</script>
</body>
</html>
