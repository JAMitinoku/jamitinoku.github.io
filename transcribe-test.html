<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>文字起こしツール</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f1220;
      --card: #171a2a;
      --text: #e9e9f0;
      --muted: #a5a5b5;
      --accent: #4ea8ff;
      --green: #4cd964;
      --red: #ff5c6c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; }
    .container { max-width: 1100px; margin: 0 auto; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
    @media (max-width: 900px){
      .container { grid-template-columns: 1fr; }
    }
    .card { background: var(--card); border-radius: 12px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
    h2 { font-size: 1rem; margin: 0 0 8px; color: #fff; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button, select, input {
      background: #1e2030; color: #fff; border: 1px solid #2a2f55; border-radius: 6px; padding: 8px 10px;
      font-size: 14px;
    }
    button.primary { background: #2d6af5; border-color: #2d6af5; }
    button.warn { background: #ff5c6c; border-color: #ff5c6c; }
    button.success { background: #29d07a; border-color: #29d07a; }
    textarea { width: 100%; min-height: 120px; resize: vertical; background: #0e1220; color: #fff; border: 1px solid #2a2f55; border-radius: 6px; padding: 8px; }
    .gauge { height: 12px; background: #2a2f55; border-radius: 6px; position: relative; overflow: hidden; }
    .gauge > span { display: block; height: 100%; background: linear-gradient(90deg, #4cd964, #4ea8ff); width: 0%; }
    .status { font-family: monospace; padding: 6px 8px; border-radius: 6px; background: #11142a; border: 1px solid #2a2f55; }
    .section-title { font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .4px; }
    .info { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 600px){
      .info { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- 左側パネル: 認識エリアと設定 -->
    <section class="card" aria-label="認識エリアと設定">
      <h2>入力と認識設定</h2>
      <div class="row" style="justify-content: space-between;">
        <button id="startBtn" class="primary" title="開始">開始</button>
        <button id="stopBtn" title="停止">停止</button>
        <button id="copyBtn" title="コピー">コピー</button>
        <button id="clearBtn" title="クリア">クリア</button>
      </div>

      <div class="row" style="margin-top:8px;">
        <label for="deviceSelect">入力デバイス選択:</label>
        <select id="deviceSelect" title="入力デバイス選択" style="min-width: 180px;"></select>
      </div>

      <div class="row" style="margin-top:8px;">
        <label for="sensitivitySelect">感度調整:</label>
        <select id="sensitivitySelect" title="感度調整" style="min-width: 120px;">
          <!-- 1-100 -->
        </select>
      </div>

      <div class="row" style="margin-top:8px;">
        <span class="section-title" aria-label="ブーストゲージ">ブースト</span>
        <div class="gauge" style="flex:1"><span id="boostFill" style="width: 50%;"></span></div>
        <span id="boostValue" class="status" style="min-width: 70px; text-align:center;">10</span>
      </div>

      <div class="row" style="margin-top:8px;">
        <span class="section-title" aria-label="感度レベルゲージ">感度レベル</span>
        <div class="gauge" style="flex:1"><span id="sensitivityLevelFill" style="width: 40%;"></span></div>
        <span id="sensitivityLevelValue" class="status" style="min-width: 70px; text-align:center;">40</span>
      </div>

      <div class="row" style="margin-top:8px;">
        <button id="resetDeviceBtn" title="デバイスリセット">デバイスリセット</button>
        <span id="serverStatus" class="status" title="音声認識サーバ接続状態" style="margin-left:auto;">接続済み</span>
      </div>
    </section>

    <!-- 右側パネル: 文字起こし表示と情報表示 -->
    <section class="card" aria-label="文字起こし表示と情報" style="min-height: 300px;">
      <h2>認識エリア</h2>

      <!-- 認識中エリア -->
      <div id="recognitionLive" class="section" style="display:block; margin-bottom:8px;">
        <div class="row" style="justify-content: space-between; align-items: center;">
          <span class="section-title" style="margin:0;">認識中エリア</span>
          <span class="status" id="liveStatus" title="認識中の状態">待機</span>
        </div>
        <textarea id="liveText" placeholder="ここに認識途中の文字が表示されます..." rows="6" ></textarea>
      </div>

      <!-- 認識確定エリア -->
      <div id="confirmedArea" class="section" style="margin-bottom:8px;">
        <div class="row" style="justify-content: space-between; align-items: center;">
          <span class="section-title" style="margin:0;">認識確定エリア</span>
          <span class="status" id="confirmedCount" title="確定済み文字数">0文字</span>
        </div>
        <textarea id="confirmedText" placeholder="確定済みの文字がここに表示されます..." rows="6" readonly></textarea>
      </div>

      <!-- 情報表示エリア -->
      <div id="infoArea" class="section" aria-label="情報表示エリア">
        <div class="section-title" style="margin-bottom:6px;">情報表示エリア</div>
        <div class="info" aria-label="状態情報">
          <div>接続: <strong id="statusConnection">未知</strong></div>
          <div>デバイス: <strong id="statusDevice">未選択</strong></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    // 状態モデル
    const state = {
      connected: true,
      device: null,
      devices: [],
      sensitivity: 50, // 1-100
      boost: 10, // 1-20
      liveBuffer: '',
      confirmedBuffer: '',
      inProgress: false,
      retryDelay: 1000,
      maxRetries: 5,
      retries: 0
    };

    // UI要素取得
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const deviceSelect = document.getElementById('deviceSelect');
    const sensitivitySelect = document.getElementById('sensitivitySelect');
    const boostFill = document.getElementById('boostFill');
    const boostValue = document.getElementById('boostValue');
    const sensitivityLevelFill = document.getElementById('sensitivityLevelFill');
    const sensitivityLevelValue = document.getElementById('sensitivityLevelValue');
    const resetDeviceBtn = document.getElementById('resetDeviceBtn');
    const serverStatus = document.getElementById('serverStatus');
    const liveText = document.getElementById('liveText');
    const liveStatus = document.getElementById('liveStatus');
    const confirmedText = document.getElementById('confirmedText');
    const confirmedCount = document.getElementById('confirmedCount');
    const statusConnection = document.getElementById('statusConnection');
    const statusDevice = document.getElementById('statusDevice');
    const infoArea = document.getElementById('infoArea');

    // 初期データロード（ローカルストレージ保存対応）
    function loadState() {
      try {
        const saved = localStorage.getItem('transcript_state');
        if (saved) {
          const obj = JSON.parse(saved);
          Object.assign(state, obj);
        }
      } catch (e) {}
      // UI反映
      updateUI();
    }

    function saveState() {
      try {
        localStorage.setItem('transcript_state', JSON.stringify(state));
      } catch (e) {}
    }

    // 初期デバイスリスト生成（実APIは実装時に置換）
    function enumerateDevices() {
      // 実運用では navigator.mediaDevices.enumerateDevices() などを使います。
      // ここではデモ用のダミーを挿入
      const dummy = [
        { id: 'default', label: 'デフォルトマイク' },
        { id: 'mic1', label: 'マイク 1' },
        { id: 'mic2', label: 'マイク 2' }
      ];
      state.devices = dummy;
      deviceSelect.innerHTML = '';
      dummy.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.id;
        opt.textContent = d.label;
        deviceSelect.appendChild(opt);
      });
      // 初期選択
      state.device = dummy[0].id;
      deviceSelect.value = state.device;
      statusDevice.textContent = dummy[0].label;
    }

    // 感度調整のセレクト
    function populateSensitivity() {
      for (let i = 1; i <= 100; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = i;
        if (i === state.sensitivity) opt.selected = true;
        sensitivitySelect.appendChild(opt);
      }
    }

    // UI更新
    function updateUI() {
      // ブースト・感度レベル表示
      boostFill.style.width = (state.boost / 20 * 100) + '%';
      boostValue.textContent = String(state.boost);

      const sl = Math.max(0, Math.min(100, Math.round(state.sensitivity)));
      sensitivityLevelFill.style.width = sl + '%';
      sensitivityLevelValue.textContent = sl;

      // 接続表示
      statusConnection.textContent = state.connected ? '接続済み' : '切断';
      serverStatus.textContent = state.connected ? '接続済み' : '切断';
      statusDevice.textContent = state.device ? state.device : '未選択';
      // 認識エリア
      liveStatus.textContent = state.inProgress ? '認識中' : '待機';
      // 文字エリアは現在保持分を反映（自動更新はイベント時に行います）
      confirmedText.value = state.confirmedBuffer;
      liveText.value = state.liveBuffer;
      confirmedCount.textContent = `${state.confirmedBuffer.length}文字`;
      // 情報エリアは保存
      infoArea.style.opacity = 1;
      saveState();
    }

    // 文字列の適切な追加処理（落ちを防ぐ最低限の実装）
    function appendLive(text) {
      // 重複回避・不適切な連結を避ける
      if (!text) return;
      // 連続の「、」「。」は1つになるように
      state.liveBuffer += text;
      // 確定エリアへは「認識確定」時に移動させる想定
      liveText.value = state.liveBuffer;
      // 簡易的な「確定」判断（適宜要件に合わせて実装）
    }

    // 結果を確定エリアへ反映
    function confirmLiveToConfirmed() {
      if (!state.liveBuffer) return;
      // 末尾改行を不要にするために整形
      let text = state.liveBuffer;
      // 重複する改行を排除
      text = text.replace(/\n+/g, '\n');
      state.confirmedBuffer += text;
      state.liveBuffer = '';
      liveText.value = '';
      confirmedText.value = state.confirmedBuffer;
      confirmedCount.textContent = `${state.confirmedBuffer.length}文字`;
      saveState();
      // 読みやすさのために改行を適切に挿入
    }

    // 認識開始/停止（デモ用の模擬挙動）
    let recognitionInterval = null;

    function startRecognition() {
      if (state.inProgress) return;
      state.inProgress = true;
      liveStatus.textContent = '認識中';
      // 模擬音声データを定期的に追加
      recognitionInterval = setInterval(() => {
        // 実運用ではここで SpeechRecognition の結果を受け取る
        const sample = generateSample();
        if (sample) {
          appendLive(sample);
          liveText.value = state.liveBuffer;
          // ここでは一定時間ごとに確定する仮定
          if (state.liveBuffer.length > 20) {
            confirmLiveToConfirmed();
          }
        }
      }, Math.max(200, 600 - state.sensitivity)); // 感度が高いと頻度増
      // 接続再試行なし
    }

    function stopRecognition() {
      if (!state.inProgress) return;
      state.inProgress = false;
      liveStatus.textContent = '待機';
      if (recognitionInterval) clearInterval(recognitionInterval);
      recognitionInterval = null;
      // 最後に確定させる場合は以下
      // confirmLiveToConfirmed();
    }

    // ダミーサンプル生成
    function generateSample() {
      // ランダムな短文風のサンプルを返す
      const samples = [
        'こんにちは', '今日の天気は良いですね', 'AIは便利です', 'テキストへ転換します', '音声認識を開始しました'
      ];
      // 確率で選ぶ
      if (Math.random() < 0.5) {
        return samples[Math.floor(Math.random() * samples.length)];
      }
      return '';
    }

    // クリップボードコピー
    async function copyToClipboard() {
      try {
        const text = confirmedText.value;
        if (!text) return;
        await navigator.clipboard.writeText(text);
        alert('コピーしました');
      } catch (e) {
        // コピー失敗時のフォールバック
        prompt('コピーできませんでした。以下を選択してコピーしてください：', confirmedText.value);
      }
    }

    // デバイスリセット
    function resetDeviceSelection() {
      enumerateDevices();
      // 既定のデバイスへ戻す
      if (state.devices.length) {
        const first = state.devices[0];
        state.device = first.id;
        deviceSelect.value = first.id;
        statusDevice.textContent = first.label;
      }
      // 接続状態を回復
      state.connected = true;
      updateUI();
    }

    // イベント設定
    startBtn.addEventListener('click', () => {
      startRecognition();
      updateUI();
    });

    stopBtn.addEventListener('click', () => {
      stopRecognition();
      updateUI();
    });

    copyBtn.addEventListener('click', () => {
      copyToClipboard();
    });

    clearBtn.addEventListener('click', () => {
      state.liveBuffer = '';
      state.confirmedBuffer = '';
      liveText.value = '';
      confirmedText.value = '';
      updateUI();
    });

    deviceSelect.addEventListener('change', (e) => {
      state.device = e.target.value;
      const label = state.devices.find(d => d.id === state.device)?.label ?? 'デバイス';
      statusDevice.textContent = label;
      // サーバ側へ変更通知する場合はここに呼び出し
      updateUI();
    });

    sensitivitySelect.addEventListener('change', (e) => {
      const v = parseInt(e.target.value, 10);
      if (!Number.isNaN(v)) {
        state.sensitivity = v;
        updateUI();
      }
    });

    resetDeviceBtn.addEventListener('click', () => {
      resetDeviceSelection();
    });

    // サーバ接続監視のシミュレーション（実運用では WebSocket/HTTP 状態管理へ置換）
    function simulateServerDisconnect() {
      // 乱数で切断を模倣
      if (Math.random() < 0.05) {
        state.connected = false;
        updateUI();
        // 自動復旧を試みる
        setTimeout(() => {
          state.connected = true;
          updateUI();
        }, 3000);
      }
    }

    // 初期化
    function init() {
      enumerateDevices();
      populateSensitivity();
      // 初期値セット
      updateUI();
      // 自動復旧・安定性のための定期チェック
      setInterval(() => {
        simulateServerDisconnect();
      }, 2000);
    }

    // ウィンドウサイズに合わせてリサイズ対応（必要に応じて微調整）
    window.addEventListener('resize', () => {
      // 現時点で特別な処理は不要。CSSが自動的に対応します。
    });

    // 初期化実行
    loadState();
    init();
  </script>
</body>
</html>
