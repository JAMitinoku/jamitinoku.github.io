<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>逐語録システム（スマホ完全対応・フル機能版）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f1f3f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        .app-container {
            width: 100%;
            height: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        .main-card {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        h2 {
            font-size: 14px;
            text-align: center;
            color: #212529;
            padding-bottom: 6px;
            margin-bottom: 6px;
            border-bottom: 1px solid #dee2e6;
            flex-shrink: 0;
        }

        .status-bar {
            width: 100%;
            padding: 8px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            border-radius: 6px;
            background-color: #fff3cd;
            color: #856404;
            margin-bottom: 6px;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .config-box {
            width: 100%;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 6px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            flex-shrink: 0;
        }
        .config-item {
            display: flex;
            flex-direction: column;
        }
        .config-item.full {
            grid-column: span 2;
        }
        label {
            font-size: 11px;
            font-weight: bold;
            color: #495057;
            margin-bottom: 2px;
        }
        select {
            width: 100%;
            padding: 4px 6px;
            border-radius: 6px;
            border: 1px solid #ced4da;
            font-size: 13px;
            background-color: #ffffff;
            color: #212529;
            height: 34px;
        }

        .btn-group {
            width: 100%;
            margin-bottom: 4px;
            display: grid;
            grid-template-columns: 1.2fr repeat(4, 1fr); 
            gap: 4px;
            flex-shrink: 0;
        }
        
        button {
            width: 100%;
            height: 44px;
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }
        button:active { opacity: 0.7; }
        button:disabled { background-color: #ced4da !important; color: #6c757d !important; opacity: 0.5; }
        
        #start { background-color: #007bff; }
        #stop { background-color: #dc3545; }
        #copy { background-color: #17a2b8; }
        #save { background-color: #28a745; }
        #clear { background-color: #6c757d; }

        .reset-box {
            width: 100%;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        #reset-dev {
            background-color: #343a40;
            height: 30px;
            font-size: 11px;
            border-radius: 6px;
        }

        .output-wrapper {
            flex: 1;
            width: 100%;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            background-color: #fafafa;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px;
            min-height: 0;
        }

        #output-text {
            font-size: 16px;
            line-height: 1.7;
            word-break: break-all;
            color: #212529;
        }
        #final-span { white-space: pre-wrap; }
        #interim-span { color: #868e96; font-style: italic; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="main-card">
        <h2>逐語録システム（スマホ完全対応版）</h2>
        <div class="status-bar" id="status-display">「開始」を押してください</div>
        
        <div class="config-box">
            <div class="config-item full">
                <label for="device-select">入力デバイス選択（マイク）</label>
                <select id="device-select"><option value="">既定のマイク（自動選択）</option></select>
            </div>
            <div class="config-item">
                <label for="sensitivity-select">感度（文字の間引き）</label>
                <select id="sensitivity-select"></select>
            </div>
            <div class="config-item">
                <label for="boost-select">マイクブースト（倍率）</label>
                <select id="boost-select"></select>
            </div>
        </div>

        <div class="btn-group">
            <button id="start">開始</button>
            <button id="stop" disabled>停止</button>
            <button id="copy">コピー</button>
            <button id="save">保存</button>
            <button id="clear">クリア</button>
        </div>
        <div class="reset-box">
            <button id="reset-dev">デバイスの再読み込み</button>
        </div>

        <div class="output-wrapper" id="scroll-container">
            <div id="output-text">
                <span id="final-span"></span><span id="interim-span"></span>
            </div>
        </div>
    </div>
</div>

<script>
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const copyBtn = document.getElementById('copy');
    const saveBtn = document.getElementById('save');
    const clearBtn = document.getElementById('clear');
    const resetDevBtn = document.getElementById('reset-dev');
    const finalSpan = document.getElementById('final-span');
    const interimSpan = document.getElementById('interim-span');
    const scrollContainer = document.getElementById('scroll-container');
    const statusDisp = document.getElementById('status-display');
    const deviceSelect = document.getElementById('device-select');
    const sensitivitySelect = document.getElementById('sensitivity-select');
    const boostSelect = document.getElementById('boost-select');

    let recognition = null;
    let isActive = false;
    let restartTimeoutId = null;
    let wakeLock = null;
    let confirmedHistory = [];

    // 音量増幅用の変数
    let audioCtx = null;
    let audioStream = null;
    let gainNode = null;

    // 選択肢の自動生成
    for(let i=1; i<=50; i++){
        const optS = document.createElement('option');
        optS.value = i; optS.innerText = i === 20 ? `${i} (標準)` : i;
        if(i===20) optS.selected = true;
        sensitivitySelect.appendChild(optS);

        const optB = document.createElement('option');
        optB.value = i; optB.innerText = i === 30 ? `x${i} (標準)` : `x${i}`;
        if(i===30) optB.selected = true;
        boostSelect.appendChild(optB);
    }

    function updateStatus(state, msg) {
        statusDisp.innerText = msg;
        if (state === 'online') {
            statusDisp.style.backgroundColor = "#d4edda"; statusDisp.style.color = "#155724";
        } else if (state === 'offline') {
            statusDisp.style.backgroundColor = "#e2e3e5"; statusDisp.style.color = "#383d41";
        } else {
            statusDisp.style.backgroundColor = "#fff3cd"; statusDisp.style.color = "#856404";
        }
    }

    // デバイス一覧の取得・更新
    async function initDevices() {
        try {
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
            const currentSelected = deviceSelect.value;
            const devices = await navigator.mediaDevices.enumerateDevices();
            
            deviceSelect.innerHTML = '<option value="">既定のマイク（自動選択）</option>';
            devices.forEach(device => {
                if (device.kind === 'audioinput') {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.innerText = device.label || `マイク (${device.deviceId.slice(0,5)})`;
                    if (device.deviceId === currentSelected && currentSelected !== "") {
                        option.selected = true;
                    }
                    deviceSelect.appendChild(option);
                }
            });
        } catch (e) {
            console.warn("デバイス一覧の取得に失敗しました:", e);
        }
    }

    // 画面スリープ防止
    async function requestWakeLock() {
        if ('wakeLock' in navigator) {
            try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }
    }
    function releaseWakeLock() {
        if (wakeLock) { wakeLock.release().then(() => wakeLock = null); }
    }

    // ブースト倍率のリアルタイム変更反映
    boostSelect.onchange = () => {
        if (gainNode) {
            gainNode.gain.value = parseInt(boostSelect.value);
        }
    };

    // システム全体の起動
    async function startSystem() {
        // --- ★重要★ スマホのタップ直後にAudioContextを同期生成（ロック回避） ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            audioCtx = new AudioContext();
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            updateStatus('offline', "ブラウザが音声認識に対応していません");
            return;
        }

        try {
            // 選択されたデバイスIDを指定してマイクを起動
            const constraints = { audio: true };
            if (deviceSelect.value) {
                constraints.audio = { deviceId: { exact: deviceSelect.value } };
            }
            audioStream = await navigator.mediaDevices.getUserMedia(constraints);
            
            // 初回マイク許可時にラベル名が空になる対策としてデバイス一覧を再取得
            await initDevices();
            
            // 音量増幅の接続処理
            if (audioCtx && audioStream) {
                const source = audioCtx.createMediaStreamSource(audioStream);
                gainNode = audioCtx.createGain();
                gainNode.gain.value = parseInt(boostSelect.value);
                source.connect(gainNode);
                
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
            }
        } catch (err) {
            console.warn("マイク増幅設定でエラーが発生しましたが、通常認識を試みます:", err);
        }

        // 音声認識の初期化
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = true;
        recognition.continuous = true;

        recognition.onstart = () => {
            updateStatus('online', "音声認識中（ブースト有効）... お話しください");
            requestWakeLock();
        };

        recognition.onresult = (e) => {
            let interimText = '';
            for (let i = e.resultIndex; i < e.results.length; i++) {
                let transcript = e.results[i][0].transcript;
                
                // 感度調整（文字の間引き計算）
                const minLengthFilter = Math.max(0, Math.floor((30 - parseInt(sensitivitySelect.value)) / 10));
                
                if (e.results[i].isFinal) {
                    let cleanedText = transcript.trim();
                    if (cleanedText.length < minLengthFilter) continue;

                    // フィラー（口癖）削除
                    const fillerRegex = /^(えーと|えーっと|えー、|あのー|あの、|えー|あの|まー|うーん|えっと)/g;
                    cleanedText = cleanedText.replace(fillerRegex, "").replace(/[、\s](えーと|えーっと|えー、|あのー|あの、|えー|あの|えっと)[、\s]?/g, " ").trim();
                    if (cleanedText === "") continue;

                    // 重複ダブり防御
                    let isDuplicate = false;
                    const checkLength = Math.min(cleanedText.length, 6);
                    const incomingChunk = cleanedText.substring(0, checkLength);
                    for (let h = confirmedHistory.length - 1; h >= Math.max(0, confirmedHistory.length - 3); h--) {
                        if (confirmedHistory[h].includes(incomingChunk) || incomingChunk.includes(confirmedHistory[h].substring(0,3))) {
                            isDuplicate = true;
                            break;
                        }
                    }
                    if (isDuplicate) continue; 

                    confirmedHistory.push(cleanedText);
                    if (confirmedHistory.length > 10) confirmedHistory.shift();

                    // 改行と句読点整形
                    const currentFinal = finalSpan.innerText.trim();
                    let separator = "";
                    if (currentFinal !== "") {
                        if (/[。？！?!]$/.test(currentFinal)) { separator = "\n"; } 
                        else if (/[、]$/.test(currentFinal)) { separator = " "; } 
                        else { separator = "。\n"; }
                    }
                    if (!/[。？！?!、]$/.test(cleanedText)) { cleanedText += "。"; }

                    finalSpan.innerText += separator + cleanedText;
                } else {
                    interimText += transcript;
                }
            }
            interimSpan.innerText = interimText;
            setTimeout(() => { scrollContainer.scrollTop = scrollContainer.scrollHeight; }, 30);
        };

        recognition.onend = () => {
            if (isActive) {
                clearTimeout(restartTimeoutId);
                restartTimeoutId = setTimeout(() => {
                    if (isActive && recognition) {
                        try { recognition.start(); } catch(err){}
                    }
                }, 200);
            }
        };

        recognition.onerror = (ev) => {
            console.error("認識エラー:", ev.error);
            if (ev.error === 'not-allowed') {
                updateStatus('offline', "マイクの権限がありません");
                stopBtn.click();
            }
        };

        try {
            recognition.start();
        } catch(e) {
            console.error("音声認識の起動に失敗しました:", e);
        }
    }

    // 開始ボタン
    startBtn.onclick = () => {
        isActive = true;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        deviceSelect.disabled = true;
        updateStatus('', "システム起動中...");
        
        if (recognition) {
            try { recognition.onstart = null; recognition.onresult = null; recognition.onend = null; recognition.onerror = null; recognition.stop(); } catch(e){}
        }
        
        startSystem();
    };

    // 停止ボタン
    stopBtn.onclick = () => {
        isActive = false;
        clearTimeout(restartTimeoutId);
        startBtn.disabled = false;
        stopBtn.disabled = true;
        deviceSelect.disabled = false;
        
        if (recognition) { try { recognition.stop(); } catch(e){} }
        if (audioStream) { try { audioStream.getTracks().forEach(t => t.stop()); } catch(e){} }
        if (audioCtx) { try { audioCtx.close(); } catch(e){} }
        
        gainNode = null;
        releaseWakeLock();
        updateStatus('offline', "停止しました");
    };

    // コピー
    copyBtn.onclick = async () => {
        const text = finalSpan.innerText;
        if (!text.trim()) return;
        try {
            await navigator.clipboard.writeText(text);
            const originalText = copyBtn.innerText; copyBtn.innerText = "完了";
            setTimeout(() => copyBtn.innerText = originalText, 1200);
        } catch (err) { alert("長押ししてコピーしてください：\n\n" + text); }
    };

    // 保存
    saveBtn.onclick = () => {
        const text = finalSpan.innerText;
        if (!text.trim()) { alert("保存するテキストがありません"); return; }
        const now = new Date();
        const filename = `逐語録_${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}_${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}.txt`;
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8;' });
        const link = document.createElement("a");
        if (link.download !== undefined) {
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url); link.setAttribute("download", filename);
            link.style.visibility = 'hidden'; document.body.appendChild(link);
            link.click(); document.body.removeChild(link); URL.revokeObjectURL(url);
        } else { window.open(encodeURI("data:text/plain;charset=utf-8," + text)); }
    };

    // クリア
    clearBtn.onclick = () => {
        if (confirm("表示されているテキストを消去しますか？")) {
            finalSpan.innerText = ""; interimSpan.innerText = ""; confirmedHistory = [];
        }
    };

    // デバイス再読み込み（リセットボタン）
    resetDevBtn.onclick = async () => {
        try {
            // 一度空のマイクテストを走らせてブラウザにデバイス名を教え込ませる
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach(track => track.stop());
            await initDevices();
            updateStatus('offline', "デバイスリストを更新しました");
        } catch(e) {
            alert("マイクの使用許可をブラウザの設定等からオンにしてください");
        }
    };

    // 画面が開いたときに自動でマイクを探す
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
                await initDevices();
            }
        } catch(e) { 
            console.log("初期デバイスリスト読み込みスキップ"); 
        }
    });
</script>

</body>
</html>
