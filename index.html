<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理ツール一覧</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        .news-card { margin-bottom: 2rem; padding: 1.5rem; }
        .meta-info { display: flex; gap: 1rem; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .category { background: #e0e0e0; padding: 2px 8px; border-radius: 4px; color: #333; }
        .date { color: #666; }
        /* ボタンのサイズを少し小さく調整 */
        .more-link { display: inline-block; margin-top: 1rem; padding: 0.5rem 1.2rem; font-size: 0.9rem; }
    </style>
</head>
<body>

    <main class="container">
        <header style="text-align: center; margin-bottom: 3rem;">
            <h1 id="site-title">読み込み中...</h1>
            <p id="site-subtitle"></p>
        </header>

        <section id="news-list">
            <!-- 記事が自動挿入されます -->
        </section>
    </main>

    <script src="data.js"></script>
    <script>
        // 基本情報の反映
        document.getElementById('site-title').textContent = cmsData.siteInfo.title;
        document.getElementById('site-subtitle').textContent = cmsData.siteInfo.subtitle;

        // 記事一覧の生成
        const listContainer = document.getElementById('news-list');
        
        cmsData.news.forEach(item => {
            const article = document.createElement('article');
            article.className = 'news-card';
            
            // 基礎となるHTMLを作成
            let htmlContent = `
                <div class="meta-info">
                    <span class="date">${item.date}</span>
                    <span class="category">${item.category}</span>
                </div>
                <h3>${item.title}</h3>
                <p>${item.content}</p>
            `;
            
            // 【追加】URLが設定されている場合のみ、リンクボタンを追加する
            if (item.url && item.url.trim() !== "") {
                htmlContent += `
                    <a href="${item.url}" class="button more-link" target="_blank" rel="noopener noreferrer">
                        詳細を見る
                    </a>
                `;
            }
            
            article.innerHTML = htmlContent;
            listContainer.appendChild(article);
        });
    </script>
</body>
</html>
