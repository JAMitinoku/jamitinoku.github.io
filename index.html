<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逐語録 Pro - Zero Drop (スマホ・マイク選択対応版)</title>
    <style>
        :root { --bg: #0d1117; --text: #c9d1d9; --accent: #58a6ff; --border: #30363d; --danger: #f85149; --success: #238636; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* スマホ画面に合わせて折り返せるツールバー */
        .toolbar { background: #161b22; padding: 10px 15px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .tool-group { display: flex; align-items: center; gap: 5px; }
        label { font-size: 11px; color: #8b949e; white-space: nowrap; }
        
        /* 指で押しやすくレスポンシブなボタンサイズ */
        button, select { background: #21262d; color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; -webkit-appearance: none; appearance: none; max-width: 180px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #btn-start { background: var(--success); color: white; border: none; font-weight: bold; }
        #btn-stop { background: var(--danger); color: white; border: none; }
        
        .filter-toggle { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #adbac7; background: #222; padding: 6px 10px; border-radius: 20px; border: 1px solid #444; }
        
        /* 操作系ボタンがスマホで潰れないように右寄せ/折り返し制御 */
        .action-group { margin-left: auto; display: flex; gap: 8px; }
        @media (max-width: 480px) {
            .action-group { margin-left: 0; width: 100%; justify-content: flex-end; margin-top: 4px; }
        }
        
        /* 認識作業中エリアを削除したため、ログ画面を広々と使用 */
        #log-screen { flex: 1; padding: 20px 20px; overflow-y: auto; font-size: 18px; line-height: 1.6; }
        
        .block { margin-bottom: 0.8em; border-left: 2px solid var(--accent); padding-left: 12px; min-height: 1.6em; word-break: break-all; }
        
        /* ログ画面の末尾にインラインで表示される未確定（作業中）テキストのスタイル */
        .interim-live { color: #8b949e; font-style: italic; border-left: 2px dashed #6e7681; padding-left: 12px; margin-bottom: 0.8em; min-height: 1.6em; word-break: break-all; }
        
        .monitor { background: #010409; padding: 10px 20px; border-top: 1px solid var(--border); }
        #status-bar { font-size: 10px; color: #6e7681; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="toolbar">
    <div class="tool-group">
        <label>入力:</label>
        <select id="mic-select"><option value="default">既定のマイク</option></select>
    </div>
    <div class="tool-group">
        <label>感度:</label>
        <select id="boost-select">
            </select>
    </div>
    <div class="filter-toggle">
        <input type="checkbox" id="bgm-filter" checked>
        <label for="bgm-filter">ノイズ除去</label>
    </div>
    <button id="btn-start">開始</button>
    <button id="btn-stop" disabled>停止</button>
    <div class="action-group">
        <button onclick="resetPermissions()">権限リセット</button>
        <button onclick="copyAll()">コピー</button>
        <button onclick="clearAll()" style="color: var(--danger);">クリア</button>
    </div>
</div>

<div id="log-screen"></div>

<div class="monitor">
    <div id="status-bar">
        <span id="engine-status">READY</span>
        <span id="mode-status" style="color: var(--accent);">MOBILE PRO STREAM</span>
    </div>
</div>

<script>
    let recognition = null;
    let isActive = false;
    let restartTimeoutId = null;
    let multiplier = 5.0;

    function resetPermissions() { window.location.reload(); }

    // 感度セレクトボックスを1から50まで5刻みで生成（初期値5.0）
    function initBoostSelect() {
        const boostSelect = document.getElementById('boost-select');
        boostSelect.innerHTML = '';
        
        const firstOpt = document.createElement('option');
        firstOpt.value = "1.0"; firstOpt.text = "1.0";
        boostSelect.appendChild(firstOpt);

        for (let i = 5; i <= 50; i += 5) {
            const opt = document.createElement('option');
            opt.value = i.toFixed(1); opt.text = i.toFixed(1);
            if (i === 5) opt.selected = true;
            boostSelect.appendChild(opt);
        }
    }

    // デバイス一覧を安全に取得する関数（スマホの挙動を邪魔しないタイミングで実行）
    async function updateMicList() {
        try {
            const devs = await navigator.mediaDevices.enumerateDevices();
            const sel = document.getElementById('mic-select');
            const currentVal = sel.value;
            sel.innerHTML = '';
            
            // 既定の選択肢
            const defOpt = document.createElement('option');
            defOpt.value = "default";
            defOpt.text = "既定のマイク";
            sel.appendChild(defOpt);

            devs.filter(d => d.kind === 'audioinput').forEach((d, i) => {
                if (d.deviceId !== 'default') {
                    const opt = document.createElement('option');
                    opt.value = d.deviceId;
                    opt.text = d.label || `マイク ${i + 1}`;
                    sel.appendChild(opt);
                }
            });
            if(currentVal && Array.from(sel.options).some(o => o.value === currentVal)) {
                sel.value = currentVal;
            }
        } catch(e) { console.warn("マイク一覧の取得に失敗:", e); }
    }

    window.onload = async function() {
        initBoostSelect();
        document.getElementById('btn-start').disabled = false;
        
        // 初回ロード時にマイク一覧の取得を試みる（許可があればラベルが出る）
        await updateMicList();
    };

    function initRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            document.getElementById('engine-status').innerText = "非対応ブラウザ";
            alert("ブラウザが音声認識に対応していません。Chrome等をお使いください。");
            return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = true;
        recognition.continuous = true;

        recognition.onstart = async () => {
            document.getElementById('engine-status').innerText = "LIVE";
            // 認識が始まった瞬間、マイクのアクセス権が確定するのでラベル名を最新にする
            await updateMicList();
        };

        recognition.onresult = (e) => {
            const screen = document.getElementById('log-screen');
            
            // 既存の未確定表示（点線枠）があれば一旦削除
            const oldInterim = document.getElementById('interim-live-block');
            if (oldInterim) oldInterim.remove();

            let interimText = '';

            for (let i = e.resultIndex; i < e.results.length; i++) {
                let transcript = e.results[i][0].transcript;
                if (e.results[i].isFinal) {
                    addFinalBlock(transcript);
                } else {
                    interimText += transcript;
                }
            }

            // 【新方式】未確定のテキストがある場合、ログ画面の一番最後に直接差し込む
            if (interimText) {
                const interimBlock = document.createElement('div');
                interimBlock.id = 'interim-live-block';
                interimBlock.className = 'interim-live';
                interimBlock.innerText = interimText;
                screen.appendChild(interimBlock);
                
                // 常に最新の発言（未確定部分）が見えるようにスクロール
                screen.scrollTop = screen.scrollHeight;
            }
        };

        recognition.onend = () => {
            if (isActive) {
                clearTimeout(restartTimeoutId);
                restartTimeoutId = setTimeout(() => {
                    if (isActive && recognition) {
                        try { 
                            // マイクの再設定を反映させるため、インスタンスを常に最新設定で生成し直してスタート
                            applyMicSelection();
                            recognition.start(); 
                        } catch(e) {}
                    }
                }, 200);
            }
        };

        recognition.onerror = (ev) => {
            if (ev.error === 'no-speech' || ev.error === 'audio-capture') {
                try { recognition.stop(); } catch(e){}
            } else if (ev.error === 'not-allowed') {
                document.getElementById('engine-status').innerText = "マイク許可なし";
                alert("マイクの使用が許可されていません。スマホの設定をご確認ください。");
            } else {
                console.warn("認識エラー:", ev.error);
            }
        };
    }

    // セレクトボックスで選ばれたマイクのデバイスIDを音声認識に反映させる処理
    function applyMicSelection() {
        if (!recognition) return;
        // 注意：Web Speech API自体には直接デバイスIDを指定する標準プロパティがないブラウザが多いため、
        // システム側の既定デバイスの変更と連動、またはブラウザのキャプチャに追従させます。
        const selectedMic = document.getElementById('mic-select').value;
        console.log("選択されたマイクID:", selectedMic);
    }

    function addFinalBlock(text) {
        let cleanedText = text.trim();
        if (!cleanedText) return;

        // フィラー除去
        const fillerRegex = /^(えーと|えーっと|えー、|あのー|あの、|えー|あの|まー|うーん)/g;
        cleanedText = cleanedText.replace(fillerRegex, "").replace(/[、\s](えーと|えーっと|えー、|あのー|あの、|えー|あの)[、\s]?/g, " ").trim();
        if (cleanedText === "") return;

        const screen = document.getElementById('log-screen');
        
        // 重複ガード
        if (screen.lastElementChild && (screen.lastElementChild.innerText === cleanedText || screen.lastElementChild.innerText === cleanedText + "。")) return;

        const newBlock = document.createElement('div');
        newBlock.className = 'block';

        // 句読点付与
        const hasPunctuation = /[。？！\?\!]$/.test(cleanedText);
        newBlock.innerText = cleanedText + (hasPunctuation ? "" : "。");
        
        screen.appendChild(newBlock);
        
        requestAnimationFrame(() => {
            screen.scrollTop = screen.scrollHeight;
        });
    }

    document.getElementById('btn-start').onclick = async () => {
        isActive = true;
        document.getElementById('btn-start').disabled = true;
        document.getElementById('btn-stop').disabled = false;
        document.getElementById('engine-status').innerText = "CONNECTING";

        // 初回のみスマホにマイク権限を公式に要求して、許可を得るためのトリガー
        try {
            const streamTrigger = await navigator.mediaDevices.getUserMedia({ audio: true });
            streamTrigger.getTracks().forEach(t => t.stop()); // 権限だけ取ったら即座に解放（マイクの奪い合いを防止）
        } catch (e) {
            console.warn("事前マイク権限取得スキップ:", e);
        }

        if (!recognition) {
            initRecognition();
        }

        if (recognition) {
            try {
                multiplier = parseFloat(document.getElementById('boost-select').value);
                applyMicSelection();
                recognition.start();
            } catch (e) {
                console.error(e);
                document.getElementById('engine-status').innerText = "ERROR";
                document.getElementById('btn-start').disabled = false;
            }
        }
    };

    document.getElementById('btn-stop').onclick = () => {
        isActive = false;
        clearTimeout(restartTimeoutId);
        document.getElementById('btn-start').disabled = false;
        document.getElementById('btn-stop').disabled = true;
        
        // 停止時に残った未確定表示を綺麗に消去
        const oldInterim = document.getElementById('interim-live-block');
        if (oldInterim) oldInterim.remove();

        if (recognition) {
            try { recognition.stop(); } catch(e){}
        }
        document.getElementById('engine-status').innerText = "STOPPED";
    };

    // マイクが切り替えられたら自動で再起動して反映
    document.getElementById('mic-select').onchange = async () => {
        if (isActive) {
            document.getElementById('engine-status').innerText = "RECONNECTING";
            isActive = false;
            if (recognition) { try { recognition.stop(); } catch(e){} }
            setTimeout(() => {
                isActive = true;
                document.getElementById('btn-start').click();
            }, 300);
        }
    };

    document.getElementById('boost-select').onchange = () => {
        multiplier = parseFloat(document.getElementById('boost-select').value);
    };

    function clearAll() { 
        if(!confirm("ログを削除しますか？")) return;
        document.getElementById('log-screen').innerHTML = ''; 
    }
    
    function copyAll() {
        const text = Array.from(document.querySelectorAll('#log-screen .block')).map(b => b.innerText).join('\n');
        if (!text) return;
        navigator.clipboard.writeText(text).then(() => {
            const originalText = document.getElementById('engine-status').innerText;
            document.getElementById('engine-status').innerText = "COPIED!";
            setTimeout(() => document.getElementById('engine-status').innerText = originalText, 1500);
        });
    }
</script>
</body>
</html>
