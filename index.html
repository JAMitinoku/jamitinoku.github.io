<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逐語録 Pro - Zero Drop (安定・モバイル対応版)</title>
    <style>
        :root { --bg: #0d1117; --text: #c9d1d9; --accent: #58a6ff; --border: #30363d; --danger: #f85149; --success: #238636; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* スマホでも折り返して綺麗に配置されるツールバー */
        .toolbar { background: #161b22; padding: 10px 15px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .tool-group { display: flex; align-items: center; gap: 5px; }
        label { font-size: 11px; color: #8b949e; white-space: nowrap; }
        
        /* スマホで誤タップを防ぐための程よいサイズと余白 */
        button, select { background: #21262d; color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; -webkit-appearance: none; appearance: none; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #btn-start { background: var(--success); color: white; border: none; font-weight: bold; }
        #btn-stop { background: var(--danger); color: white; border: none; }
        
        .filter-toggle { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #adbac7; background: #222; padding: 6px 10px; border-radius: 20px; border: 1px solid #444; }
        
        /* 右側の操作ボタン群をスマホの横幅に合わせて最適化 */
        .action-group { margin-left: auto; display: flex; gap: 8px; }
        @media (max-width: 480px) {
            .action-group { margin-left: 0; width: 100%; justify-content: flex-end; margin-top: 4px; }
        }
        
        #log-screen { flex: 1; padding: 20px 20px; overflow-y: auto; font-size: 18px; line-height: 1.6; border-bottom: 1px solid var(--border); }
        #interim-area { padding: 15px 20px; min-height: 3em; background: #0d1117; font-size: 18px; line-height: 1.6; }
        
        .block { margin-bottom: 0.8em; border-left: 2px solid var(--accent); padding-left: 12px; min-height: 1.6em; word-break: break-all; }
        .interim { color: #8b949e; font-style: italic; }
        
        .monitor { background: #010409; padding: 10px 20px; border-top: 1px solid var(--border); }
        #status-bar { font-size: 10px; color: #6e7681; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="toolbar">
    <div class="tool-group">
        <label>入力:</label>
        <select id="mic-select"><option value="default">既定のマイク</option></select>
    </div>
    <div class="tool-group">
        <label>感度:</label>
        <select id="boost-select">
            </select>
    </div>
    <div class="filter-toggle">
        <input type="checkbox" id="bgm-filter" checked>
        <label for="bgm-filter">ノイズ除去</label>
    </div>
    <button id="btn-start">開始</button>
    <button id="btn-stop" disabled>停止</button>
    <div class="action-group">
        <button onclick="resetPermissions()">権限リセット</button>
        <button onclick="copyAll()">コピー</button>
        <button onclick="clearAll()" style="color: var(--danger);">クリア</button>
    </div>
</div>

<div id="log-screen"></div>

<div id="interim-area">
    <div id="active-line" class="block interim">ここに認識結果が表示されます...</div>
</div>

<div class="monitor">
    <div id="status-bar">
        <span id="engine-status">READY</span>
        <span id="mode-status" style="color: var(--accent);">MOBILE OPTIMIZED</span>
    </div>
</div>

<script>
    let recognition = null;
    let isRunning = false;
    let stream = null;
    let restartTimeoutId = null;
    let multiplier = 5.0;

    function resetPermissions() { window.location.reload(); }

    // 1〜50（5刻み、初期値5）のセレクトボックス生成
    function initBoostSelect() {
        const boostSelect = document.getElementById('boost-select');
        boostSelect.innerHTML = '';
        
        const firstOpt = document.createElement('option');
        firstOpt.value = "1.0"; firstOpt.text = "1.0";
        boostSelect.appendChild(firstOpt);

        for (let i = 5; i <= 50; i += 5) {
            const opt = document.createElement('option');
            opt.value = i.toFixed(1); opt.text = i.toFixed(1);
            if (i === 5) opt.selected = true;
            boostSelect.appendChild(opt);
        }
    }

    window.onload = function() {
        initBoostSelect();
        // スマホではロード時のマイク取得で全体がフリーズするのを防ぐため、最初から開始ボタンを解放
        document.getElementById('btn-start').disabled = false;
    };

    function addFinalBlock(text) {
        let cleanedText = text.trim();
        if (!cleanedText) return;

        const fillerRegex = /^(えーと|えーっと|えー、|あのー|あの、|えー|あの|まー|うーん)/g;
        cleanedText = cleanedText.replace(fillerRegex, "").replace(/[、\s](えーと|えーっと|えー、|あのー|あの、|えー|あの)[、\s]?/g, " ").trim();
        if (cleanedText === "") return;

        const screen = document.getElementById('log-screen');
        if (screen.lastElementChild && (screen.lastElementChild.innerText === cleanedText || screen.lastElementChild.innerText === cleanedText + "。")) return;

        const newBlock = document.createElement('div');
        newBlock.className = 'block';

        const hasPunctuation = /[。？！\?\!]$/.test(cleanedText);
        newBlock.innerText = cleanedText + (hasPunctuation ? "" : "。");
        
        screen.appendChild(newBlock);
        requestAnimationFrame(() => { screen.scrollTop = screen.scrollHeight; });
    }

    function createRecognitionInstance() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) {
            alert("音声認識に対応していないブラウザです。Chrome等をお試しください。");
            return null;
        }

        const rec = new Speech();
        rec.lang = 'ja-JP';
        rec.continuous = true;
        rec.interimResults = true;

        rec.onstart = () => {
            document.getElementById('engine-status').innerText = "LIVE";
            document.getElementById('btn-stop').disabled = false;
        };

        rec.onresult = (e) => {
            const activeLine = document.getElementById('active-line');
            let interimStr = "";

            for (let i = e.resultIndex; i < e.results.length; i++) {
                if (e.results[i].isFinal) {
                    addFinalBlock(e.results[i][0].transcript);
                } else {
                    interimStr += e.results[i][0].transcript;
                }
            }
            const nextText = interimStr || "...";
            if (activeLine.innerText !== nextText) activeLine.innerText = nextText;
        };

        rec.onend = () => {
            if (isRunning) {
                clearTimeout(restartTimeoutId);
                restartTimeoutId = setTimeout(() => {
                    if (isRunning) {
                        try {
                            // Android特有のストリーム固着対策：インスタンスを毎回破棄・再生成して完全復帰
                            recognition = createRecognitionInstance();
                            if (recognition) recognition.start();
                        } catch(err) {
                            console.warn("オートリスタート失敗回避:", err);
                        }
                    }
                }, 350);
            }
        };

        rec.onerror = (ev) => {
            if (ev.error === 'not-allowed') {
                document.getElementById('engine-status').innerText = "マイク許可なし";
                alert("マイクの使用許可が必要です。ブラウザの設定等をご確認ください。");
            } else if (ev.error === 'network') {
                document.getElementById('engine-status').innerText = "NET ERROR";
            }
        };

        return rec;
    }

    // 【スマホ最重要】クリックイベントの「同期処理」として一番最初に認識を走らせる
    document.getElementById('btn-start').onclick = function() {
        try {
            document.getElementById('btn-start').disabled = true;
            document.getElementById('engine-status').innerText = "CONNECTING";
            isRunning = true;
            
            multiplier = parseFloat(document.getElementById('boost-select').value);
            
            // 認識エンジンを最優先で即座に直接スタート。これでストリームが詰まりません。
            recognition = createRecognitionInstance();
            if (recognition) {
                recognition.start();
            }

            // マイクデバイス等のデバイス処理は認識が走り出した後に、裏側で非同期に処理させる
            const deviceId = document.getElementById('mic-select').value;
            const filterActive = document.getElementById('bgm-filter').checked;
            const constraints = {
                audio: {
                    deviceId: deviceId !== 'default' && deviceId ? { exact: deviceId } : undefined,
                    echoCancellation: true,
                    noiseSuppression: filterActive,
                    autoGainControl: true
                }
            };

            navigator.mediaDevices.getUserMedia(constraints).then(s => {
                stream = s;
                // 利用可能なマイク一覧をバックグラウンドでそっと更新
                navigator.mediaDevices.enumerateDevices().then(devs => {
                    const sel = document.getElementById('mic-select');
                    const currentVal = sel.value;
                    sel.innerHTML = '';
                    devs.filter(d => d.kind === 'audioinput').forEach((d, i) => {
                        const opt = document.createElement('option');
                        opt.value = d.deviceId;
                        opt.text = d.label || `Mic ${i + 1}`;
                        sel.appendChild(opt);
                    });
                    if(currentVal && Array.from(sel.options).some(o => o.value === currentVal)) sel.value = currentVal;
                }).catch(e => console.error(e));
            }).catch(err => {
                console.warn("バックグラウンドマイク処理スキップ（認識は単独で継続します）", err);
            });

        } catch (err) {
            console.error("起動エラー:", err);
            document.getElementById('engine-status').innerText = "ERROR";
            document.getElementById('btn-start').disabled = false;
            isRunning = false;
        }
    };

    document.getElementById('btn-stop').onclick = () => {
        document.getElementById('btn-stop').disabled = true;
        isRunning = false;
        clearTimeout(restartTimeoutId);

        if (recognition) {
            recognition.onend = null;
            recognition.onerror = null;
            try { recognition.stop(); } catch(e){}
            try { recognition.abort(); } catch(e){}
            recognition = null;
        }
        if (stream) { stream.getTracks().forEach(t => { try { t.stop(); } catch(e){} }); stream = null; }
        
        document.getElementById('btn-start').disabled = false;
        document.getElementById('engine-status').innerText = "STOPPED";
        document.getElementById('active-line').innerText = "停止中";
    };

    document.getElementById('boost-select').onchange = () => {
        multiplier = parseFloat(document.getElementById('boost-select').value);
    };

    function clearAll() { 
        if(!confirm("ログを削除しますか？")) return;
        document.getElementById('log-screen').innerHTML = ''; 
        document.getElementById('active-line').innerText = "...";
    }
    
    function copyAll() {
        const text = Array.from(document.querySelectorAll('#log-screen .block')).map(b => b.innerText).join('\n');
        if (!text) return;
        navigator.clipboard.writeText(text).then(() => {
            const originalText = document.getElementById('engine-status').innerText;
            document.getElementById('engine-status').innerText = "COPIED!";
            setTimeout(() => document.getElementById('engine-status').innerText = originalText, 1500);
        });
    }
</script>
</body>
</html>
