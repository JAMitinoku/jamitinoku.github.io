<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>音声認識ツール (Edge最適化・自動復旧版)</title>
    <style>
        body { font-family: sans-serif; height: 98vh; display: flex; flex-direction: column; padding: 10px; box-sizing: border-box; }
        .toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; background: #eee; padding: 10px; border-radius: 5px; align-items: center; }
        #interim { height: 50px; border: 1px solid #ddd; background: #fff; padding: 8px; color: #666; overflow-y: auto; margin-bottom: 10px; }
        #output { flex-grow: 1; border: 1px solid #999; padding: 10px; width: 100%; box-sizing: border-box; font-size: 16px; white-space: pre-wrap; background-color: #fff; }
        #output:read-only { background-color: #f9f9f9; color: #333; }
        .status { font-weight: bold; color: #333; margin-left: 10px; }
        .control-group { display: flex; align-items: center; gap: 5px; font-size: 14px; }
        select { padding: 4px; }
        button { padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>

<div class="toolbar">
    <button id="startBtn">開始</button>
    <button id="stopBtn">停止</button>
    <button id="clearBtn">クリア</button>
    <button id="copyBtn">コピー</button>
    <button id="saveBtn">保存</button>
    <span id="status" class="status">● 停止中</span>
    
    <div class="control-group">
        <label>感度設定:</label>
        <select id="sensitivity">
            <option value="50">低感度 (50%)</option>
            <option value="100" selected>標準 (100%)</option>
            <option value="150">高感度 (150%)</option>
            <option value="200">最大ブースト (200%)</option>
        </select>
    </div>
</div>

<div id="interim"></div>
<textarea id="output" placeholder="ここにテキストが表示されます。停止中は直接編集可能です。"></textarea>

<script>
    const output = document.getElementById('output');
    const interim = document.getElementById('interim');
    const status = document.getElementById('status');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    const recognition = new SpeechRecognition();
    let isRunning = false;
    let lastResultTime = Date.now();

    recognition.lang = 'ja-JP';
    recognition.interimResults = true;
    recognition.continuous = true;

    recognition.onstart = () => {
        status.textContent = '● 認識中';
        output.readOnly = true; 
        lastResultTime = Date.now();
    };

    recognition.onresult = (event) => {
        lastResultTime = Date.now();
        let interimText = '';
        let finalOutput = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
                finalOutput += transcript + "\n";
            } else {
                interimText += transcript;
            }
        }
        if (finalOutput !== '') {
            output.value += finalOutput;
            output.scrollTop = output.scrollHeight;
        }
        interim.textContent = interimText;
    };

    // 【自動復旧タイマー】7秒間反応がない場合は強制再起動
    setInterval(() => {
        if (isRunning && (Date.now() - lastResultTime > 5000)) {
            console.log("無反応検知: 7秒経過したため再起動します");
            recognition.stop(); 
        }
    }, 2000);

    recognition.onend = () => {
        if (isRunning) {
            recognition.start();
        } else {
            status.textContent = '● 停止中';
            output.readOnly = false;
        }
    };

    document.getElementById('startBtn').onclick = () => {
        isRunning = true;
        try { recognition.start(); } catch(e) {}
    };

    document.getElementById('stopBtn').onclick = () => {
        isRunning = false;
        recognition.stop();
    };

    document.getElementById('clearBtn').onclick = () => {
        output.value = "";
        interim.textContent = "";
    };

    document.getElementById('copyBtn').onclick = () => {
        navigator.clipboard.writeText(output.value).then(() => {
            alert("コピーしました");
        });
    };

    document.getElementById('saveBtn').onclick = () => {
        const blob = new Blob([output.value], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'memo.txt';
        a.click();
    };
</script>
</body>
</html>
