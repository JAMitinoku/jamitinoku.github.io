<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声認識エディタ</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #f0f0f0; }
        /* コントロールエリア */
        #controls { background: #333; color: white; padding: 10px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background: red; }
        
        /* エリア設定 */
        #main-container { flex: 1; display: flex; flex-direction: column; padding: 10px; overflow: hidden; gap: 10px; }
        #interim-area { height: 150px; background: #fff; padding: 10px; border: 1px solid #ccc; overflow-y: auto; color: #888; font-size: 1.2em; }
        #final-area { flex: 1; background: #fff; padding: 10px; border: 1px solid #ccc; overflow-y: auto; font-size: 1.5em; white-space: pre-wrap; }
        
        /* 編集状態 */
        #final-area[contenteditable="true"] { background: #fffde7; border: 1px solid #ffd600; }
    </style>
</head>
<body>

<div id="controls">
    <div id="status-indicator" class="status-dot"></div>
    <button id="start-btn">開始</button>
    <button id="stop-btn">停止</button>
    <button id="clear-btn">クリア</button>
    <button id="save-btn">保存</button>
    <button id="copy-btn">コピー</button>
    <button id="reset-btn">デバイスリセット</button>
    
    <select id="sensitivity">
        <option>通常</option>
        <option>最高感度</option>
        <option>低め</option>
    </select>
    <select id="boost">
        <option>ブースト1</option>
        <option>50</option>
        <option>100</option>
    </select>
</div>

<div id="main-container">
    <div id="interim-area" placeholder="未確定テキスト..."></div>
    <div id="final-area" contenteditable="false"></div>
</div>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    
    let isRecognizing = false;
    const finalArea = document.getElementById('final-area');
    const interimArea = document.getElementById('interim-area');
    const statusDot = document.getElementById('status-indicator');

    recognition.lang = 'ja-JP';
    recognition.continuous = true;
    recognition.interimResults = true;

    // --- 音声認識ロジック ---
    recognition.onstart = () => {
        isRecognizing = true;
        statusDot.style.background = 'lime';
        finalArea.contentEditable = "false";
    };

    recognition.onend = () => {
        // 自動再接続
        if (isRecognizing) {
            recognition.start();
        } else {
            statusDot.style.background = 'red';
            finalArea.contentEditable = "true"; // 停止中のみ編集可能
        }
    };

    recognition.onresult = (event) => {
        let interimText = '';
        let finalTrans = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
                // 確定データ処理
                let transcript = event.results[i][0].transcript.trim();
                if (transcript) {
                    // 空白除去、句読点自動付与（ブラウザエンジンに依存）
                    finalTrans += transcript + '\n';
                }
            } else {
                interimText += event.results[i][0].transcript;
            }
        }

        if (finalTrans) {
            finalArea.innerText += finalTrans;
            finalArea.scrollTop = finalArea.scrollHeight; // オートスクロール
        }
        interimArea.innerText = interimText;
    };

    // --- ボタン操作 ---
    document.getElementById('start-btn').onclick = () => {
        isRecognizing = true;
        recognition.start();
    };

    document.getElementById('stop-btn').onclick = () => {
        isRecognizing = false;
        recognition.stop();
    };

    document.getElementById('clear-btn').onclick = () => {
        finalArea.innerText = '';
        interimArea.innerText = '';
    };

    document.getElementById('copy-btn').onclick = () => {
        navigator.clipboard.writeText(finalArea.innerText);
        alert('コピーしました');
    };

    document.getElementById('save-btn').onclick = () => {
        const blob = new Blob([finalArea.innerText], {type: 'text/plain'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'transcript.txt';
        a.click();
    };

    document.getElementById('reset-btn').onclick = () => {
        window.location.reload();
    };
</script>
</body>
</html>
