<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声認識ツール</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 98vh; margin: 0; padding: 10px; box-sizing: border-box; }
        .toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; background: #eee; padding: 10px; border-radius: 5px; align-items: center; }
        #output { flex-grow: 1; border: 1px solid #999; padding: 15px; width: 100%; box-sizing: border-box; font-size: 16px; line-height: 1.6; resize: none; margin-bottom: 5px; overflow-y: auto;}
        #interim { height: 50px; border: 1px solid #ddd; background: #fff; padding: 5px; color: #888; overflow-y: auto; font-size: 14px; }
        .status { padding: 5px; font-size: 0.9em; color: #555; }
        button { cursor: pointer; padding: 5px 15px; }
    </style>
</head>
<body>

<div class="toolbar">
    <button id="startBtn">開始</button>
    <button id="stopBtn">停止</button>
    <button id="clearBtn">クリア</button>
    <button id="saveBtn">保存</button>
    <button id="copyBtn">コピー</button>
    <button id="resetBtn">デバイスリセット</button>
    <select id="deviceSelect"><option>音声入力: 既定</option></select>
    <select id="sensitivity">
        <option value="0.9">最高感度</option>
        <option value="0.5" selected>通常</option>
        <option value="0.2">低め</option>
    </select>
    <select id="boost">
        <option value="0">ブースト なし</option>
        <option value="10">ブースト 10</option>
        <option value="20">ブースト 20</option>
        <option value="30">ブースト 30</option>
        <option value="40">ブースト 40</option>
        <option value="50" selected>ブースト 50</option>
        <option value="60">ブースト 60</option>
        <option value="70">ブースト 70</option>
        <option value="80">ブースト 80</option>
        <option value="90">ブースト 90</option>
        <option value="100">ブースト 100</option>
    </select>
    <div id="status" class="status">● 待機中</div>
</div>

<textarea id="output" placeholder="確定した文章がここに溜まります。"></textarea>
<div id="interim" placeholder="未確定のテキストがここに表示されます..."></div>

<script>
    const output = document.getElementById('output');
    const interim = document.getElementById('interim');
    const status = document.getElementById('status');
    const sensitivity = document.getElementById('sensitivity');
    const boost = document.getElementById('boost');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition, isRunning = false;
    let isFocused = false;

    output.addEventListener('focus', () => isFocused = true);
    output.addEventListener('blur', () => isFocused = false);

    const handleSettingsChange = () => {
        if (isRunning) {
            recognition.stop();
        }
    };
    sensitivity.addEventListener('change', handleSettingsChange);
    boost.addEventListener('change', handleSettingsChange);

    function initRecognition() {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = true;
        recognition.continuous = true;

        recognition.onstart = () => { status.innerHTML = '<span style="color:green;">● 認識中</span>'; isRunning = true; };

        recognition.onresult = (event) => {
            let finalTranscript = '';
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    let text = event.results[i][0].transcript.trim();
                    if (text && !/[。、！？]$/.test(text)) text += "。";
                    finalTranscript += text + "\n";
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            
            if (finalTranscript) {
                const currentStart = output.selectionStart;
                const currentEnd = output.selectionEnd;
                const currentScroll = output.scrollTop;

                output.focus();
                output.setSelectionRange(output.value.length, output.value.length);
                
                let textToInsert = finalTranscript;
                if (output.value.length > 0 && output.value.endsWith("\n")) {
                    textToInsert = textToInsert.replace(/^\n+/, "");
                }
                
                document.execCommand('insertText', false, textToInsert);
                
                if (isFocused) {
                    output.setSelectionRange(currentStart, currentEnd);
                    output.scrollTop = currentScroll;
                } else {
                    output.scrollTop = output.scrollHeight;
                }
            }
            interim.innerText = interimTranscript;
        };

        recognition.onend = () => { 
            if (isRunning) {
                setTimeout(() => recognition.start(), 50); 
            } else { 
                status.innerHTML = '<span style="color:red;">● 停止中</span>'; 
            }
        };
    }

    document.getElementById('startBtn').onclick = () => { isRunning = true; recognition.start(); };
    document.getElementById('stopBtn').onclick = () => { isRunning = false; recognition.stop(); };
    document.getElementById('clearBtn').onclick = () => { output.value = ""; };
    document.getElementById('copyBtn').onclick = () => { output.select(); document.execCommand('copy'); };
    document.getElementById('resetBtn').onclick = () => location.reload();
    document.getElementById('saveBtn').onclick = () => {
        const blob = new Blob([output.value], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'memo.txt';
        a.click();
    };

    initRecognition();
</script>
</body>
</html>
