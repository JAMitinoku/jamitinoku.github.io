<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声認識ツール</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 98vh; margin: 0; padding: 10px; box-sizing: border-box; }
        .toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; background: #eee; padding: 10px; border-radius: 5px; align-items: center; }
        #interim { height: 60px; border: 1px solid #ddd; background: #fff; padding: 5px; color: #555; overflow-y: auto; font-size: 16px; margin-bottom: 5px; }
        #output { flex-grow: 1; border: 1px solid #999; padding: 15px; width: 100%; box-sizing: border-box; font-size: 16px; line-height: 1.6; resize: none; overflow-y: auto;}
        .status { padding: 5px; font-size: 0.9em; color: #555; }
        button { cursor: pointer; padding: 5px 15px; }
    </style>
</head>
<body>

<div class="toolbar">
    <button id="startBtn">開始</button>
    <button id="stopBtn">停止</button>
    <button id="clearBtn">クリア</button>
    <button id="saveBtn">保存</button>
    <button id="copyBtn">コピー</button>
    <button id="resetBtn">デバイスリセット</button>
    <div id="status" class="status">● 待機中</div>
</div>

<div id="interim" placeholder="未確定のテキストがここに表示されます..."></div>
<textarea id="output" placeholder="確定した文章がここに溜まります。"></textarea>

<script>
    const output = document.getElementById('output');
    const interim = document.getElementById('interim');
    const status = document.getElementById('status');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    let recognition;
    let isRunning = false;

    function initRecognition() {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = true;
        recognition.continuous = true;

        recognition.onstart = () => { 
            status.innerHTML = '<span style="color:green;">● 認識中</span>'; 
        };

        recognition.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    output.value += event.results[i][0].transcript + "\n";
                    output.scrollTop = output.scrollHeight;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            interim.innerText = interimTranscript;
        };

        // 停止ボタン押下時はisRunningがfalseになっているため、再起動させない
        recognition.onerror = () => { if (isRunning) recognition.start(); };
        recognition.onend = () => { 
            if (isRunning) {
                recognition.start(); 
            } else {
                status.innerHTML = '<span style="color:red;">● 停止中</span>';
            }
        };
    }

    document.getElementById('startBtn').onclick = () => { isRunning = true; recognition.start(); };
    document.getElementById('stopBtn').onclick = () => { isRunning = false; recognition.stop(); };
    document.getElementById('clearBtn').onclick = () => output.value = "";
    document.getElementById('copyBtn').onclick = () => { output.select(); document.execCommand('copy'); };
    document.getElementById('resetBtn').onclick = () => location.reload();
    document.getElementById('saveBtn').onclick = () => {
        const blob = new Blob([output.value], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'memo.txt';
        a.click();
    };

    initRecognition();
</script>
</body>
</html>
