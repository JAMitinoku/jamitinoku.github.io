<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>逐語録 Pro - Zero Drop (完全版)</title>
    <style>
        :root { --bg: #0d1117; --text: #c9d1d9; --accent: #58a6ff; --border: #30363d; --danger: #f85149; --success: #238636; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .toolbar { background: #161b22; padding: 10px 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .tool-group { display: flex; align-items: center; gap: 5px; }
        label { font-size: 11px; color: #8b949e; }
        button, select { background: #21262d; color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        #btn-start { background: var(--success); color: white; border: none; font-weight: bold; }
        #btn-stop { background: var(--danger); color: white; border: none; }
        .workspace { flex: 1; display: flex; overflow: hidden; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--border); }
        #log-screen { flex: 1; padding: 20px 30px; overflow-y: auto; font-size: 18px; line-height: 1.6; }
        .block { margin-bottom: 0.8em; border-left: 2px solid var(--accent); padding-left: 12px; min-height: 1.6em; cursor: pointer; }
        .log-panel { width: 300px; background: #161b22; font-family: monospace; font-size: 11px; color: #39ff14; padding: 15px; overflow-y: auto; }
        .monitor { background: #010409; padding: 8px 20px; border-top: 1px solid var(--border); }
        .meter-bg { height: 3px; background: #333; margin: 5px 0; }
        #meter-fill { height: 100%; width: 0%; background: var(--accent); }
    </style>
</head>
<body>

<div class="toolbar">
    <div class="tool-group">
        <label>入力:</label>
        <select id="mic-select"></select>
    </div>
    <div class="tool-group">
        <label>感度:</label>
        <select id="boost-select">
            <option value="1.0">1.0</option>
            <option value="2.0" selected>2.0</option>
            <option value="4.0">4.0</option>
        </select>
    </div>
    <div class="tool-group">
        <input type="checkbox" id="filler-filter" checked>
        <label for="filler-filter">フィラー削除</label>
    </div>
    <button id="btn-start">開始</button>
    <button id="btn-stop" disabled>停止</button>
    <button onclick="copyAll()">コピー</button>
    <button onclick="saveAll()">保存</button>
    <button onclick="clearAll()" style="color:var(--danger)">クリア</button>
</div>

<div class="workspace">
    <div class="main-content">
        <div id="log-screen"></div>
        <div id="active-line" class="block" style="color:#8b949e; font-style:italic;">停止中</div>
    </div>
    <div id="log-area" class="log-panel"></div>
</div>

<div class="monitor"><div class="meter-bg"><div id="meter-fill"></div></div></div>

<script>
    let recognition = null, audioCtx = null, source = null, gainNode = null, analyser = null;

    async function init() {
        const devs = await navigator.mediaDevices.enumerateDevices();
        const sel = document.getElementById('mic-select');
        devs.filter(d => d.kind === 'audioinput').forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.deviceId; opt.text = d.label || 'Mic'; sel.appendChild(opt);
        });
    }

    function addFinalBlock(text) {
        let cleanedText = text.trim();
        if (document.getElementById('filler-filter').checked) {
            cleanedText = cleanedText.replace(/^(えーと|あのー|えー|あの|まー)/g, "");
        }
        if (cleanedText === "") return;

        const newBlock = document.createElement('div');
        newBlock.className = 'block';
        newBlock.innerText = cleanedText + "。";
        
        newBlock.onclick = function() {
            if (this.querySelector('textarea')) return;
            const originalText = this.innerText;
            this.innerHTML = `<textarea style="width:100%; height:1.6em; background:transparent; color:inherit; border:1px solid var(--accent); outline:none;">${originalText}</textarea>`;
            const ta = this.querySelector('textarea'); ta.focus();
            ta.onblur = () => { if(ta.value.trim()==="") this.remove(); else this.innerText = ta.value; };
            ta.onkeydown = (e) => { if(e.key === 'Enter') { e.preventDefault(); ta.blur(); } };
        };
        document.getElementById('log-screen').appendChild(newBlock);
    }

    document.getElementById('btn-start').onclick = async () => {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: document.getElementById('mic-select').value } });
        audioCtx = new AudioContext();
        source = audioCtx.createMediaStreamSource(stream);
        gainNode = audioCtx.createGain();
        gainNode.gain.value = parseFloat(document.getElementById('boost-select').value);
        analyser = audioCtx.createAnalyser();
        source.connect(gainNode).connect(analyser);
        
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new Speech();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.onresult = (e) => {
            for (let i = e.resultIndex; i < e.results.length; i++) {
                if (e.results[i].isFinal) addFinalBlock(e.results[i][0].transcript);
                else document.getElementById('active-line').innerText = e.results[i][0].transcript;
            }
        };
        recognition.start();
        
        // メーター更新
        const update = () => {
            const arr = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(arr);
            document.getElementById('meter-fill').style.width = (arr.reduce((a,b)=>a+b)/arr.length)*4 + "%";
            requestAnimationFrame(update);
        };
        update();
        document.getElementById('btn-start').disabled = true;
        document.getElementById('btn-stop').disabled = false;
    };

    document.getElementById('btn-stop').onclick = () => {
        recognition.stop();
        audioCtx.close();
        document.getElementById('btn-start').disabled = false;
        document.getElementById('btn-stop').disabled = true;
    };

    function clearAll() { if(confirm("消去しますか？")) document.getElementById('log-screen').innerHTML = ''; }
    function copyAll() { navigator.clipboard.writeText(Array.from(document.querySelectorAll('.block')).map(b => b.innerText).join('\n')); }
    function saveAll() { const blob = new Blob([Array.from(document.querySelectorAll('.block')).map(b => b.innerText).join('\n')], {type:'text/plain'}); const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download="逐語録.txt"; a.click(); }
    window.onload = init;
</script>
</body>
</html>
