<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>逐語録 Pro - Stable Edition</title>
    <style>
        :root { --bg: #0d1117; --text: #c9d1d9; --accent: #58a6ff; --border: #30363d; --danger: #f85149; --success: #238636; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .toolbar { background: #161b22; padding: 10px 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .tool-group { display: flex; align-items: center; gap: 5px; }
        label { font-size: 11px; color: #8b949e; }
        button, select { background: #21262d; color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #btn-start { background: var(--success); color: white; border: none; font-weight: bold; }
        #btn-stop { background: var(--danger); color: white; border: none; }
        .filter-toggle { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #adbac7; background: #222; padding: 5px 10px; border-radius: 20px; border: 1px solid #444; }
        #log-screen { flex: 1; padding: 20px 30px; overflow-y: auto; font-size: 18px; line-height: 1.6; }
        .block { margin-bottom: 0.8em; border-left: 2px solid var(--accent); padding-left: 12px; min-height: 1.6em; }
        .interim { color: #8b949e; font-style: italic; }
        .monitor { background: #010409; padding: 8px 20px; border-top: 1px solid var(--border); }
        .meter-bg { height: 3px; background: #333; border-radius: 2px; margin: 5px 0; }
        #meter-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.1s; }
        #status-bar { display: flex; justify-content: space-between; font-size: 10px; color: #6e7681; }
    </style>
</head>
<body>

<div class="toolbar">
    <div class="tool-group">
        <label>入力:</label>
        <select id="mic-select"><option>読み込み中...</option></select>
    </div>
    <div class="tool-group">
        <label>感度:</label>
        <select id="boost-select">
            <option value="1.0" selected>1.0</option>
            <option value="2.0">2.0</option>
            <option value="3.0">3.0</option>
            <option value="4.0">4.0</option>
            <option value="5.0">5.0</option>
            <option value="6.0">6.0</option>
            <option value="7.0">7.0</option>
            <option value="8.0">8.0</option>
            <option value="9.0">9.0</option>
            <option value="10.0">10.0</option>
        </select>
    </div>
    <div class="filter-toggle">
        <input type="checkbox" id="bgm-filter">
        <label for="bgm-filter">ノイズ除去</label>
    </div>
    <button id="btn-start" disabled>開始</button>
    <button id="btn-stop" disabled>停止</button>
    <div style="margin-left: auto; display: flex; gap: 8px;">
        <button onclick="resetPermissions()">権限リセット</button>
        <button onclick="copyAll()">コピー</button>
        <button onclick="clearAll()" style="color: var(--danger);">クリア</button>
    </div>
</div>

<div id="log-screen">
    <div id="active-line" class="block"></div>
</div>

<div class="monitor">
    <div id="status-bar">
        <span id="engine-status">INITIALIZING...</span>
        <span id="filter-status">FILTER: OFF</span>
    </div>
    <div class="meter-bg"><div id="meter-fill"></div></div>
</div>

<script>
    let recognition, stream, audioCtx, analyser, gainNode, bHighPass, bPeaking;
    let isRunning = false;
    let restartTimer;

    async function resetPermissions() {
        if (confirm("ページをリロードしてマイクを初期化します。")) window.location.reload();
    }

    async function init() {
        const sel = document.getElementById('mic-select');
        try {
            const temp = await navigator.mediaDevices.getUserMedia({ audio: true });
            temp.getTracks().forEach(t => t.stop());
            const devs = await navigator.mediaDevices.enumerateDevices();
            sel.innerHTML = '';
            devs.filter(d => d.kind === 'audioinput').forEach((d, i) => {
                const opt = document.createElement('option');
                opt.value = d.deviceId;
                opt.text = d.label || `Mic ${i + 1}`;
                sel.appendChild(opt);
            });
            document.getElementById('btn-start').disabled = false;
            document.getElementById('engine-status').innerText = "READY";
        } catch (e) {
            document.getElementById('engine-status').innerText = "ERROR";
        }
    }

    function createNewBlock() {
        const screen = document.getElementById('log-screen');
        const oldLine = document.getElementById('active-line');
        if (oldLine) oldLine.removeAttribute('id');
        const newBlock = document.createElement('div');
        newBlock.className = 'block';
        newBlock.id = 'active-line';
        screen.appendChild(newBlock);
        screen.scrollTop = screen.scrollHeight;
        return newBlock;
    }

    function setupRecognition() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new Speech();
        recognition.lang = 'ja-JP';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (e) => {
            let activeLine = document.getElementById('active-line');
            if (!activeLine) return;

            let finalStr = "";
            let interimStr = "";
            for (let i = e.resultIndex; i < e.results.length; i++) {
                if (e.results[i].isFinal) finalStr += e.results[i][0].transcript;
                else interimStr += e.results[i][0].transcript;
            }

            if (finalStr) {
                if (!/[。？！]$/.test(finalStr)) finalStr += "。";
                activeLine.innerText = finalStr;
                createNewBlock();
            } else {
                activeLine.innerHTML = `<span class="interim">${interimStr}</span>`;
            }
            document.getElementById('log-screen').scrollTop = document.getElementById('log-screen').scrollHeight;
        };

        recognition.onend = () => {
            if (isRunning) {
                clearTimeout(restartTimer);
                restartTimer = setTimeout(() => { try { recognition.start(); } catch(err) {} }, 50);
            }
        };
    }

    function updateParams() {
        if (!audioCtx || !gainNode || !bHighPass || !bPeaking) return;
        
        // 感度の反映
        const boostVal = parseFloat(document.getElementById('boost-select').value);
        gainNode.gain.setTargetAtTime(boostVal, audioCtx.currentTime, 0.1);

        // ノイズ除去の反映
        const filterActive = document.getElementById('bgm-filter').checked;
        if (filterActive) {
            bHighPass.frequency.setTargetAtTime(120, audioCtx.currentTime, 0.1);
            bPeaking.gain.setTargetAtTime(8, audioCtx.currentTime, 0.1);
            document.getElementById('filter-status').innerText = "FILTER: ON";
        } else {
            bHighPass.frequency.setTargetAtTime(10, audioCtx.currentTime, 0.1);
            bPeaking.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
            document.getElementById('filter-status').innerText = "FILTER: OFF";
        }
    }

    document.getElementById('bgm-filter').onchange = updateParams;
    document.getElementById('boost-select').onchange = updateParams;

    document.getElementById('btn-start').onclick = async () => {
        try {
            const deviceId = document.getElementById('mic-select').value;
            stream = await navigator.mediaDevices.getUserMedia({
                audio: { 
                    deviceId: deviceId ? { exact: deviceId } : undefined,
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaStreamSource(stream);
            
            gainNode = audioCtx.createGain();
            
            bHighPass = audioCtx.createBiquadFilter();
            bHighPass.type = "highpass";
            
            bPeaking = audioCtx.createBiquadFilter();
            bPeaking.type = "peaking";
            bPeaking.frequency.value = 2000;
            bPeaking.Q.value = 1;

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;

            // 音声の流れ: Source -> Gain(感度) -> HighPass -> Peaking -> Analyser
            source.connect(gainNode).connect(bHighPass).connect(bPeaking).connect(analyser);
            
            updateParams();
            
            isRunning = true;
            setupRecognition();
            recognition.start();

            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-stop').disabled = false;
            document.getElementById('engine-status').innerText = "LIVE";

            const data = new Uint8Array(analyser.frequencyBinCount);
            const updateMeter = () => {
                if (!isRunning) return;
                analyser.getByteFrequencyData(data);
                const avg = data.reduce((a, b) => a + b) / data.length;
                // メーターの振れ幅を調整
                document.getElementById('meter-fill').style.width = Math.min(avg * 4, 100) + "%";
                requestAnimationFrame(updateMeter);
            };
            updateMeter();
        } catch (err) {
            alert("開始失敗");
        }
    };

    document.getElementById('btn-stop').onclick = () => {
        isRunning = false;
        clearTimeout(restartTimer);
        if (recognition) { recognition.onend = null; recognition.stop(); }
        if (stream) stream.getTracks().forEach(t => t.stop());
        if (audioCtx) audioCtx.close();
        document.getElementById('btn-start').disabled = false;
        document.getElementById('btn-stop').disabled = true;
        document.getElementById('engine-status').innerText = "STOPPED";
    };

    function clearAll() { 
        document.getElementById('log-screen').innerHTML = '<div id="active-line" class="block"></div>'; 
    }
    
    function copyAll() {
        const text = Array.from(document.querySelectorAll('.block')).map(b => b.innerText).join('\n');
        if (!text) return;
        navigator.clipboard.writeText(text).then(() => alert("コピーしました"));
    }

    window.onload = init;
</script>
</body>
</html>
