<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>逐語録 Pro - Zero Drop (完全統合・レスポンシブ版)</title>
    <style>
        :root { --bg: #0d1117; --text: #c9d1d9; --accent: #58a6ff; --border: #30363d; --danger: #f85149; --success: #238636; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* ツールバーのレスポンシブ対応 */
        .toolbar { background: #161b22; padding: 10px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        button, select { background: #21262d; color: var(--text); border: 1px solid var(--border); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        
        /* ワークスペースのレスポンシブ対応 */
        .workspace { flex: 1; display: flex; overflow: hidden; width: 100%; }
        .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); }
        
        #log-screen { flex: 1; padding: 15px; overflow-y: auto; font-size: 16px; line-height: 1.6; }
        .block { margin-bottom: 0.5em; border-left: 2px solid var(--accent); padding-left: 10px; cursor: pointer; word-break: break-all; }
        
        /* サイドパネルの固定幅調整 */
        .log-panel { width: 250px; flex-shrink: 0; background: #161b22; font-family: monospace; font-size: 10px; padding: 10px; overflow-y: auto; }
        
        .monitor { background: #010409; padding: 5px 15px; border-top: 1px solid var(--border); }
        .meter-bg { height: 3px; background: #333; width: 100%; }
        #meter-fill { height: 100%; width: 0%; background: var(--accent); }
    </style>
</head>
<body>

<div class="toolbar">
    <select id="mic-select"></select>
    <select id="boost-select"><option value="1.0">感度1.0</option><option value="2.0" selected>感度2.0</option><option value="4.0">感度4.0</option></select>
    <label><input type="checkbox" id="filler-filter" checked> フィラー削除</label>
    <button id="btn-start" style="background:var(--success); color:white;">開始</button>
    <button id="btn-stop" disabled>停止</button>
    <button onclick="copyAll()">コピー</button>
    <button onclick="saveAll()">保存</button>
    <button onclick="clearAll()" style="color:var(--danger)">クリア</button>
</div>

<div class="workspace">
    <div class="main-content">
        <div id="log-screen"></div>
        <div id="active-line" class="block" style="color:#8b949e; font-style:italic;">停止中</div>
    </div>
    <div id="log-area" class="log-panel"></div>
</div>

<div class="monitor"><div class="meter-bg"><div id="meter-fill"></div></div></div>

<script>
    let recognition = null, audioCtx = null, analyser = null;

    async function init() {
        const devs = await navigator.mediaDevices.enumerateDevices();
        const sel = document.getElementById('mic-select');
        devs.filter(d => d.kind === 'audioinput').forEach(d => {
            const opt = document.createElement('option'); opt.value = d.deviceId; opt.text = d.label || 'Mic'; sel.appendChild(opt);
        });
    }

    function addFinalBlock(text) {
        let txt = text.trim();
        if (document.getElementById('filler-filter').checked) txt = txt.replace(/^(えーと|あのー|えー|あの|まー)/g, "");
        if (txt === "") return;

        const b = document.createElement('div');
        b.className = 'block';
        b.innerText = txt + "。";
        
        b.onclick = function() {
            if (this.querySelector('textarea')) return;
            const t = this.innerText;
            this.innerHTML = `<textarea style="width:95%; background:transparent; color:inherit; border:1px solid var(--accent); outline:none;">${t}</textarea>`;
            const ta = this.querySelector('textarea'); ta.focus();
            ta.onblur = () => { if(ta.value.trim()==="") this.remove(); else this.innerText = ta.value; };
            ta.onkeydown = (e) => { if(e.key === 'Enter') { e.preventDefault(); ta.blur(); } };
        };
        document.getElementById('log-screen').appendChild(b);
        document.getElementById('log-screen').scrollTop = 99999;
    }

    document.getElementById('btn-start').onclick = async () => {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: document.getElementById('mic-select').value } });
        audioCtx = new AudioContext();
        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        source.connect(analyser);
        
        recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.onresult = (e) => {
            for (let i = e.resultIndex; i < e.results.length; i++) {
                if (e.results[i].isFinal) addFinalBlock(e.results[i][0].transcript);
                else document.getElementById('active-line').innerText = e.results[i][0].transcript;
            }
        };
        recognition.start();
        
        const update = () => {
            const arr = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(arr);
            document.getElementById('meter-fill').style.width = (arr.reduce((a,b)=>a+b)/arr.length)*4 + "%";
            requestAnimationFrame(update);
        };
        update();
        document.getElementById('btn-start').disabled = true;
        document.getElementById('btn-stop').disabled = false;
    };

    document.getElementById('btn-stop').onclick = () => { 
        recognition.stop(); 
        if(audioCtx) audioCtx.close();
        document.getElementById('btn-start').disabled = false;
        document.getElementById('btn-stop').disabled = true;
    };

    function clearAll() { if(confirm("クリアしますか？")) document.getElementById('log-screen').innerHTML = ''; }
    function copyAll() { navigator.clipboard.writeText(Array.from(document.querySelectorAll('.block')).map(b => b.innerText).join('\n')); }
    function saveAll() { const b = new Blob([Array.from(document.querySelectorAll('.block')).map(b => b.innerText).join('\n')], {type:'text/plain'}); const a = document.createElement('a'); a.href=URL.createObjectURL(b); a.download="逐語録.txt"; a.click(); }
    window.onload = init;
</script>
</body>
</html>
