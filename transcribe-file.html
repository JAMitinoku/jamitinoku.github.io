<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逐語録 Pro - File Transcriber (コントロール完全版)</title>
    <style>
        :root { --bg: #0d1117; --text: #c9d1d9; --accent: #58a6ff; --border: #30363d; --danger: #f85149; --success: #238636; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        .toolbar { background: #161b22; padding: 10px 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .tool-group { display: flex; align-items: center; gap: 6px; }
        label { font-size: 11px; color: #8b949e; white-space: nowrap; }
        
        button, select, input[type="range"], input[type="file"] { background: #21262d; color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        input[type="file"] { max-width: 150px; font-size: 11px; padding: 5px; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        
        #btn-start { background: var(--success); color: white; border: none; font-weight: bold; }
        #btn-stop { background: var(--danger); color: white; border: none; }
        
        /* 再生コントロール用のスタイル */
        .playback-panel { display: flex; align-items: center; gap: 12px; background: #1f242c; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); flex-wrap: wrap; }
        .time-display { font-family: monospace; font-size: 12px; color: #8b949e; min-width: 85px; text-align: center; }
        input[type="range"] { -webkit-appearance: none; appearance: none; background: #30363d; height: 6px; border-radius: 3px; outline: none; width: 120px; cursor: pointer; padding: 0; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); cursor: pointer; }
        
        /* ボリューム・ブースト調整の微調整 */
        .vol-group, .boost-group { display: flex; align-items: center; gap: 4px; }
        .vol-group input[type="range"] { width: 80px; }
        .boost-group input[type="range"] { width: 90px; border-color: #ffad33; }
        .vol-text, .boost-text { font-family: monospace; font-size: 11px; color: #8b949e; min-width: 35px; }

        /* ビジュアルモニター（メーターと波形） */
        .visualizer-group { display: flex; align-items: center; gap: 8px; background: #11141a; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); }
        .meter-container { width: 60px; height: 12px; background: #222; border-radius: 2px; overflow: hidden; position: relative; border: 1px solid #444; }
        .meter-bar { width: 0%; height: 100%; background: linear-gradient(to right, #238636 70%, #ffad33 85%, #f85149 100%); transition: width 0.05s linear; }
        .v-canvas { width: 100px; height: 24px; background: #000; border-radius: 3px; border: 1px solid #333; }

        #media-preview { height: 32px; max-width: 100px; background: #000; display: none; border-radius: 4px; }
        
        .action-group { margin-left: auto; display: flex; gap: 8px; }
        @media (max-width: 768px) {
            .action-group { margin-left: 0; width: 100%; justify-content: flex-end; margin-top: 4px; }
        }
        
        #log-screen { flex: 1; padding: 20px 20px; overflow-y: auto; font-size: 18px; line-height: 1.6; }
        .block { margin-bottom: 0.8em; border-left: 2px solid var(--accent); padding-left: 12px; min-height: 1.6em; word-break: break-all; transition: background 0.2s; }
        .block:hover { background: #161b22; cursor: text; }
        .block:focus { outline: none; background: #1f242c; border-left-color: #ffad33; border-radius: 0 4px 4px 0; padding-right: 8px; }
        
        .interim-live { color: #8b949e; font-style: italic; border-left: 2px dashed #6e7681; padding-left: 12px; margin-bottom: 0.8em; min-height: 1.6em; word-break: break-all; }
        
        .monitor { background: #010409; padding: 10px 20px; border-top: 1px solid var(--border); }
        #status-bar { font-size: 10px; color: #6e7681; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="toolbar">
    <div class="tool-group">
        <label>ファイル:</label>
        <input type="file" id="file-input" accept="audio/*,video/*">
    </div>

    <video id="media-preview"></video>

    <div class="playback-panel">
        <span class="time-display" id="time-show">00:00 / 00:00</span>
        <input type="range" id="seek-bar" value="0" max="100" disabled>
        
        <div class="tool-group">
            <label>速度:</label>
            <select id="speed-select" style="padding: 4px 8px; font-size: 11px;">
                <option value="0.5">0.5x</option>
                <option value="0.75">0.75x</option>
                <option value="1.0" selected>1.0x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2.0">2.0x</option>
            </select>
        </div>

        <div class="tool-group vol-group">
            <label>音量:</label>
            <input type="range" id="volume-bar" value="100" min="0" max="300"> <span class="vol-text" id="volume-show">100%</span>
        </div>

        <div class="tool-group boost-group">
            <label style="color: #ffad33; font-weight: bold;">感度ブースト:</label>
            <input type="range" id="boost-slider" value="1" min="1" max="10" step="1" style="accent-color: #ffad33;">
            <span class="boost-text" id="boost-show" style="color: #ffad33; font-weight: bold; font-family: monospace; font-size: 11px;">1倍</span>
        </div>

        <div class="visualizer-group">
            <div class="tool-group">
                <label style="font-size: 9px;">レベル:</label>
                <div class="meter-container">
                    <div id="level-meter-bar" class="meter-bar"></div>
                </div>
            </div>
            <div class="tool-group">
                <label style="font-size: 9px;">感度波形:</label>
                <canvas id="waveform-canvas" class="v-canvas"></canvas>
            </div>
        </div>
    </div>

    <button id="btn-start" disabled>文字起こし開始</button>
    <button id="btn-stop" disabled>一時停止</button>
    
    <div class="action-group">
        <button onclick="copyAll()">コピー</button>
        <button onclick="saveAll()" style="color: var(--accent);">結果保存</button>
        <button onclick="clearAll()" style="color: var(--danger);">クリア</button>
    </div>
</div>

<div id="log-screen"></div>

<div class="monitor">
    <div id="status-bar">
        <span id="engine-status">ファイルを選択してください</span>
        <span id="mode-status" style="color: var(--accent);">FILE-CONTROL OPTIMIZED + BOOST VISUALIZED</span>
    </div>
</div>

<script>
    let recognition = null;
    let isActive = false;
    let restartTimeoutId = null;
    
    let audioCtx = null;
    let sourceNode = null;
    let gainNode = null; 
    let boostNode = null; 
    let destNode = null;
    
    // 可視化用ノードと設定
    let analyserMeter = null;  // 全体音量計測用
    let analyserBoost = null;  // ブースト後波形用
    let drawVisualId = null;

    const fileInput = document.getElementById('file-input');
    const mediaPreview = document.getElementById('media-preview');
    const btnStart = document.getElementById('btn-start');
    const btnStop = document.getElementById('btn-stop');
    const engineStatus = document.getElementById('engine-status');
    
    // コントロール要素
    const seekBar = document.getElementById('seek-bar');
    const timeShow = document.getElementById('time-show');
    const speedSelect = document.getElementById('speed-select');
    const volumeBar = document.getElementById('volume-bar');
    const volumeShow = document.getElementById('volume-show');
    const boostSlider = document.getElementById('boost-slider'); 
    const boostShow = document.getElementById('boost-show');

    // UI要素
    const levelMeterBar = document.getElementById('level-meter-bar');
    const waveformCanvas = document.getElementById('waveform-canvas');
    const canvasCtx = waveformCanvas.getContext('2d');

    // ファイル選択時
    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const fileURL = URL.createObjectURL(file);
        mediaPreview.src = fileURL;
        
        if (file.type.startsWith('video/')) {
            mediaPreview.style.display = 'block';
        } else {
            mediaPreview.style.display = 'none';
        }

        btnStart.disabled = false;
        seekBar.disabled = false;
        seekBar.value = 0;
        engineStatus.innerText = "READY: " + file.name;
    };

    // メディアのメタデータ読み込み完了時（総時間の表示更新）
    mediaPreview.onloadedmetadata = () => {
        updateTimeDisplay();
    };

    // 再生位置が更新されたとき（シークバーと時間の同期）
    mediaPreview.ontimeupdate = () => {
        if (!mediaPreview.duration) return;
        if (!seekBar.dataset.dragging) {
            const progress = (mediaPreview.currentTime / mediaPreview.duration) * 100;
            seekBar.value = progress;
        }
        updateTimeDisplay();
    };

    // シークバーを操作したときの処理
    seekBar.oninput = () => {
        seekBar.dataset.dragging = "true";
    };

    seekBar.onchange = () => {
        if (!mediaPreview.duration) return;
        const newTime = (seekBar.value / 100) * mediaPreview.duration;
        
        mediaPreview.currentTime = newTime;
        seekBar.removeAttribute('data-dragging');

        if (isActive) {
            forceResetEngine();
        }
    };

    // 再生速度の変更
    speedSelect.onchange = () => {
        mediaPreview.playbackRate = parseFloat(speedSelect.value);
    };

    // 音量スライダーの変更処理（最大300%）
    volumeBar.oninput = () => {
        const volumeValue = volumeBar.value;
        volumeShow.innerText = volumeValue + "%";
        if (gainNode) {
            gainNode.gain.value = parseInt(volumeValue) / 100;
        }
    };

    // 感度ブーストの変更処理（1〜10倍・1刻み）
    boostSlider.oninput = () => {
        const boostValue = boostSlider.value;
        boostShow.innerText = boostValue + "倍";
        if (boostNode) {
            boostNode.gain.value = parseFloat(boostValue);
        }
    };

    // 時間表示のフォーマット関数 (mm:ss)
    function formatTime(seconds) {
        if (isNaN(seconds)) return "00:00";
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = Math.floor(seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function updateTimeDisplay() {
        timeShow.innerText = `${formatTime(mediaPreview.currentTime)} / ${formatTime(mediaPreview.duration)}`;
    }

    // リアルタイム描画処理（レベルメーター＆波形グラフ）
    function startVisualizer() {
        if (!analyserMeter || !analyserBoost) return;

        const bufferLengthMeter = analyserMeter.fftSize;
        const dataArrayMeter = new Uint8Array(bufferLengthMeter);

        const bufferLengthBoost = analyserBoost.frequencyBinCount;
        const dataArrayBoost = new Uint8Array(bufferLengthBoost);

        const draw = () => {
            if (!isActive) {
                levelMeterBar.style.width = '0%';
                return;
            }
            drawVisualId = requestAnimationFrame(draw);

            // 1. 音量レベルゲージの計算 (RMS値ベース)
            analyserMeter.getByteTimeDomainData(dataArrayMeter);
            let sumSquares = 0;
            for (let i = 0; i < bufferLengthMeter; i++) {
                const norm = (dataArrayMeter[i] - 128) / 128;
                sumSquares += norm * norm;
            }
            const rms = Math.sqrt(sumSquares / bufferLengthMeter);
            let levelPercent = Math.min(100, Math.floor(rms * 250));
            levelMeterBar.style.width = levelPercent + '%';

            // 2. 感度波形グラフの描画 (ブースト後の音声データ)
            analyserBoost.getByteTimeDomainData(dataArrayBoost);
            canvasCtx.fillStyle = '#000000';
            canvasCtx.fillRect(0, 0, waveformCanvas.width, waveformCanvas.height);
            
            canvasCtx.lineWidth = 1.5;
            canvasCtx.strokeStyle = '#ffad33'; 
            canvasCtx.beginPath();

            const sliceWidth = waveformCanvas.width * 1.0 / bufferLengthBoost;
            let x = 0;

            for (let i = 0; i < bufferLengthBoost; i++) {
                const v = dataArrayBoost[i] / 128.0;
                const y = v * waveformCanvas.height / 2;

                if (i === 0) {
                    canvasCtx.moveTo(x, y);
                } else {
                    canvasCtx.lineTo(x, y);
                }
                x += sliceWidth;
            }

            canvasCtx.lineTo(waveformCanvas.width, waveformCanvas.height / 2);
            canvasCtx.stroke();
        };

        draw();
    }

    function initRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            engineStatus.innerText = "非対応ブラウザ";
            return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = true;
        recognition.continuous = true;

        recognition.onstart = () => {
            engineStatus.innerText = "PROCESSING (文字起こし中...)";
        };

        recognition.onresult = (e) => {
            const screen = document.getElementById('log-screen');
            const oldInterim = document.getElementById('interim-live-block');
            if (oldInterim) oldInterim.remove();

            let interimText = '';

            for (let i = e.resultIndex; i < e.results.length; i++) {
                let transcript = e.results[i][0].transcript;
                if (e.results[i].isFinal) {
                    addFinalBlock(transcript);
                } else {
                    interimText += transcript;
                }
            }

            if (interimText) {
                const interimBlock = document.createElement('div');
                interimBlock.id = 'interim-live-block';
                interimBlock.className = 'interim-live';
                interimBlock.innerText = interimText;
                screen.appendChild(interimBlock);
                screen.scrollTop = screen.scrollHeight;
            }
        };

        recognition.onend = () => {
            if (isActive && !mediaPreview.paused && !mediaPreview.ended) {
                clearTimeout(restartTimeoutId);
                restartTimeoutId = setTimeout(() => {
                    if (isActive && recognition) {
                        try { recognition.start(); } catch(err) { forceResetEngine(); }
                    }
                }, 20); 
            }
        };

        recognition.onerror = (ev) => {
            console.warn("認識エラー:", ev.error);
            if (ev.error === 'no-speech' || ev.error === 'audio-capture' || ev.error === 'aborted') {
                try { recognition.stop(); } catch(e){}
            }
        };
    }

    function forceResetEngine() {
        if (recognition) {
            try { recognition.abort(); } catch(e){}
            recognition = null;
        }
        if (isActive) {
            initRecognition();
            try { recognition.start(); } catch(e){}
        }
    }

    mediaPreview.onended = () => {
        if (isActive) {
            stopTranscribing();
            engineStatus.innerText = "完了 (ファイルの終端に達しました)";
        }
    };

    // 開始ボタン
    btnStart.onclick = async () => {
        if (!mediaPreview.src) return;

        isActive = true;
        btnStart.disabled = true;
        btnStop.disabled = false;
        fileInput.disabled = true;
        engineStatus.innerText = "CONNECTING";

        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            sourceNode = audioCtx.createMediaElementSource(mediaPreview);
            
            // 1. 自分が聴く用の音量ノード
            gainNode = audioCtx.createGain();
            gainNode.gain.value = parseInt(volumeBar.value) / 100;

            // 2. 文字起こしエンジンに送る用の感度ブーストノード
            boostNode = audioCtx.createGain();
            boostNode.gain.value = parseFloat(boostSlider.value);

            // 3. アナライザーノードの設置
            analyserMeter = audioCtx.createAnalyser(); 
            analyserMeter.fftSize = 256;
            
            analyserBoost = audioCtx.createAnalyser(); 
            analyserBoost.fftSize = 256;

            destNode = audioCtx.createMediaStreamDestination();
            
            sourceNode.connect(analyserMeter);
            
            sourceNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            sourceNode.connect(boostNode);
            boostNode.connect(analyserBoost);
            analyserBoost.connect(destNode);

            waveformCanvas.width = waveformCanvas.clientWidth;
            waveformCanvas.height = waveformCanvas.clientHeight;
        }

        if (!recognition) {
            initRecognition();
        }

        try {
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
            mediaPreview.playbackRate = parseFloat(speedSelect.value);
            
            recognition.start();
            mediaPreview.play(); 
            
            startVisualizer();
        } catch (e) {
            console.error(e);
            forceResetEngine();
        }
    };

    // 一時停止ボタン
    btnStop.onclick = () => {
        stopTranscribing();
        engineStatus.innerText = "PAUSED (一時停止中)";
    };

    function stopTranscribing() {
        isActive = false;
        clearTimeout(restartTimeoutId);
        cancelAnimationFrame(drawVisualId);
        btnStart.disabled = false;
        btnStop.disabled = true;
        fileInput.disabled = false;
        
        mediaPreview.pause(); 

        const oldInterim = document.getElementById('interim-live-block');
        if (oldInterim) oldInterim.remove();

        if (recognition) {
            try { recognition.stop(); } catch(e){}
        }
        
        if (levelMeterBar) levelMeterBar.style.width = '0%';
    }

    function addFinalBlock(text) {
        let cleanedText = text.trim();
        if (!cleanedText) return;

        const fillerRegex = /^(えーと|えーっと|えー、|あのー|あの、|えー|あの|まー|うーん)/g;
        cleanedText = cleanedText.replace(fillerRegex, "").replace(/[、\s](えーと|えーっと|えー、|あのー|あの、|えー|あの)[、\s]?/g, " ").trim();
        if (cleanedText === "") return;

        const screen = document.getElementById('log-screen');
        if (screen.lastElementChild && (screen.lastElementChild.innerText === cleanedText || screen.lastElementChild.innerText === cleanedText + "。")) return;

        const newBlock = document.createElement('div');
        newBlock.className = 'block';

        const hasPunctuation = /[。？！\?\!]$/.test(cleanedText);
        newBlock.innerText = cleanedText + (hasPunctuation ? "" : "。");
        
        newBlock.onclick = function() {
            if (this.getAttribute('contenteditable') !== 'true') {
                this.setAttribute('contenteditable', 'true');
                this.focus();
            }
        };

        newBlock.onblur = function() {
            this.removeAttribute('contenteditable');
            this.innerText = this.innerText.trim();
            if (this.innerText === "") {
                this.remove();
            }
        };

        newBlock.onkeydown = function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                this.blur();
            }
        };
        
        screen.appendChild(newBlock);
        requestAnimationFrame(() => { screen.scrollTop = screen.scrollHeight; });
    }

    function clearAll() { 
        if(!confirm("ログを削除しますか？")) return;
        document.getElementById('log-screen').innerHTML = ''; 
    }
    
    function copyAll() {
        const text = Array.from(document.querySelectorAll('#log-screen .block')).map(b => b.innerText).join('\n');
        if (!text) return;
        navigator.clipboard.writeText(text).then(() => {
            const originalText = engineStatus.innerText;
            engineStatus.innerText = "COPIED!";
            setTimeout(() => engineStatus.innerText = originalText, 1500);
        });
    }

    function saveAll() {
        const text = Array.from(document.querySelectorAll('#log-screen .block')).map(b => b.innerText).join('\n');
        if (!text) {
            alert("保存するテキストがありません。");
            return;
        }
        const blob = new Blob([text], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'file_transcribe_log.txt';
        a.click();
        URL.revokeObjectURL(a.href);
    }
</script>
</body>
</html>
