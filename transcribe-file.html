<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声ファイル文字起こし（MP3/MP4対応）</title>
    <style>
        :root { --primary: #007bff; --danger: #dc3545; --success: #28a745; --secondary: #6c757d; --info: #17a2b8; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; padding: 15px; background: #f4f7f9; color: #333; max-width: 600px; margin: auto; }
        .card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); box-sizing: border-box; }
        h2 { margin: 0 0 15px; font-size: 1.2em; text-align: center; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .status-area { font-size: 0.9em; text-align: center; margin-bottom: 15px; padding: 10px; background: #fff3cd; border-radius: 6px; color: #856404; font-weight: bold; }
        .file-area { margin-bottom: 15px; padding: 15px; background: #f8f9fa; border: 2px dashed #ddd; border-radius: 8px; text-align: center; }
        #audio-player { width: 100%; margin-top: 10px; display: none; }
        .controls { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        button { flex: 1; min-width: 80px; padding: 14px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; color: white; transition: 0.2s; }
        #start { background: var(--primary); }
        #stop { background: var(--danger); }
        #copy { background: var(--info); }
        #clear { background: var(--secondary); }
        button:disabled { background: #ccc !important; opacity: 0.6; }
        #output-box { width: 100%; height: 400px; padding: 15px; border-radius: 12px; border: 1px solid #eef; background: #fdfdfd; overflow-y: auto; line-height: 1.8; font-size: 16px; box-sizing: border-box; }
        #final-span { color: #222; white-space: pre-wrap; }
        #interim-span { color: #999; font-style: italic; }
    </style>
</head>
<body>

<div class="card">
    <h2>ファイル文字起こし（MP3/MP4対応）</h2>
    
    <div class="file-area">
        <input type="file" id="audio-file" accept="audio/*,video/*">
        <audio id="audio-player" controls></audio>
    </div>

    <div class="status-area" id="status-display">ファイルを読み込み、「文字起こし開始」を押してください</div>
    
    <div class="controls">
        <button id="start" disabled>文字起こし開始</button>
        <button id="stop" disabled>停止</button>
        <button id="copy">コピー</button>
        <button id="clear">クリア</button>
    </div>

    <div id="output-box">
        <span id="final-span"></span>
        <span id="interim-span"></span>
    </div>
</div>

<script>
    const fileInput = document.getElementById('audio-file');
    const audioPlayer = document.getElementById('audio-player');
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const copyBtn = document.getElementById('copy');
    const clearBtn = document.getElementById('clear');
    const finalSpan = document.getElementById('final-span');
    const interimSpan = document.getElementById('interim-span');
    const outputBox = document.getElementById('output-box');
    const statusDisp = document.getElementById('status-display');

    let recognition = null;
    let isActive = false;
    let audioCtx = null;
    let mediaSource = null;

    function updateStatus(state, msg) {
        statusDisp.innerText = msg;
        if (state === 'online') {
            statusDisp.style.background = "#d4edda";
            statusDisp.style.color = "#155724";
        } else if (state === 'offline') {
            statusDisp.style.background = "#e2e3e5";
            statusDisp.style.color = "#383d41";
        } else {
            statusDisp.style.background = "#fff3cd";
            statusDisp.style.color = "#856404";
        }
    }

    // ファイルが選択されたときの処理
    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const fileURL = URL.createObjectURL(file);
        audioPlayer.src = fileURL;
        audioPlayer.style.display = "block";
        startBtn.disabled = false;
        updateStatus('', "ファイルが読み込まれました。「文字起こし開始」を押してください");
    };

    function initRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            updateStatus('offline', "ブラウザが音声認識に対応していません");
            return;
        }

        // Web Audio API を使ってプレイヤーの音をブラウザの認識システムに流す（一部ブラウザの互換性対策）
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            mediaSource = audioCtx.createMediaElementSource(audioPlayer);
            mediaSource.connect(audioCtx.destination);
        }

        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = true;
        recognition.continuous = true;

        recognition.onstart = () => {
            updateStatus('online', "文字起こし中... ファイルを再生しています。");
            audioPlayer.play(); // 音声認識が始まったら動画/音声を再生
        };

        recognition.onresult = (e) => {
            let interimText = '';
            for (let i = e.resultIndex; i < e.results.length; i++) {
                let transcript = e.results[i][0].transcript;
                if (e.results[i].isFinal) {
                    let cleanedText = transcript.trim();
                    
                    // フィラー（えー、あの）の除去
                    const fillerRegex = /^(えーと|えーっと|えー、|あのー|あの、|えー|あの|まー|うーん)/g;
                    cleanedText = cleanedText.replace(fillerRegex, "").replace(/[、\s](えーと|えーっと|えー、|あのー|あの、|えー|あの)[、\s]?/g, " ").trim();
                    
                    if (cleanedText === "") continue;

                    const currentFinal = finalSpan.innerText.trim();
                    let separator = currentFinal !== "" ? "。\n" : "";
                    if (/[。？！?!]$/.test(currentFinal)) separator = "\n";
                    if (!/[。？！?!]$/.test(cleanedText)) cleanedText += "。";

                    finalSpan.innerText += separator + cleanedText;
                } else {
                    interimText += transcript;
                }
            }
            interimSpan.innerText = interimText;
            outputBox.scrollTop = outputBox.scrollHeight;
        };

        // メディアが終了したとき、または手動で止まったとき
        recognition.onend = () => {
            if (isActive && audioPlayer.ended) {
                // 最後まで再生しきって終わった場合
                stopTranscribing();
                updateStatus('offline', "文字起こしが完了しました（ファイルの終端）");
            } else if (isActive) {
                // 予期せぬ切断の場合は再起動
                try { recognition.start(); } catch(e) {}
            }
        };

        recognition.onerror = (ev) => {
            console.warn("認識エラー:", ev.error);
        };
    }

    function stopTranscribing() {
        isActive = false;
        startBtn.disabled = false;
        stopBtn.disabled = true;
        audioPlayer.pause();
        if (recognition) {
            try { recognition.stop(); } catch(e){}
        }
    }

    startBtn.onclick = () => {
        if (!fileInput.files[0]) return;
        
        isActive = true;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        updateStatus('', "準備中...");

        if (!recognition) {
            initRecognition();
        }

        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        if (recognition) {
            try {
                // 再生位置を最初に戻す（最初からやり直す場合）
                if(audioPlayer.ended) audioPlayer.currentTime = 0;
                recognition.start();
            } catch (e) {
                console.error(e);
                updateStatus('offline', "起動に失敗しました。再読込してください。");
            }
        }
    };

    stopBtn.onclick = () => {
        stopTranscribing();
        updateStatus('offline', "一時停止しました");
    };

    copyBtn.onclick = async () => {
        const text = finalSpan.innerText;
        if (!text.trim()) return;
        try {
            await navigator.clipboard.writeText(text);
            const originalText = copyBtn.innerText;
            copyBtn.innerText = "コピー完了！";
            setTimeout(() => copyBtn.innerText = originalText, 2000);
        } catch (err) {
            alert("長押しして手動コピーしてください：\n\n" + text);
        }
    };

    clearBtn.onclick = () => {
        if (confirm("表示されているテキストを消去しますか？")) {
            finalSpan.innerText = "";
            interimSpan.innerText = "";
        }
    };
</script>

</body>
</html>
