<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逐語録 Pro - File Transcriber (2段レイアウト・500%ブースト版)</title>
    <style>
        :root { --bg: #0d1117; --text: #c9d1d9; --accent: #58a6ff; --border: #30363d; --danger: #f85149; --success: #238636; }
        
        * { box-sizing: border-box; }
        
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; position: relative; overflow: hidden; }
        
        /* ツールバーを2段構成にするためのコンテナ */
        .toolbar { background: #161b22; border-bottom: 1px solid var(--border); width: 100%; display: flex; flex-direction: column; }
        
        /* 各段（行）の基本スタイル */
        .toolbar-row { display: flex; align-items: center; gap: 12px; padding: 10px 15px; width: 100%; flex-wrap: wrap; }
        .toolbar-row.top-row { border-bottom: 1px solid #21262d; } /* 1段目と2段目の区切り線 */
        .toolbar-row.bottom-row { background: #1f242c; } /* 2段目（再生コントロール側）の背景をわずかに変えて区別 */
        
        .tool-group { display: flex; align-items: center; gap: 6px; position: relative; }
        label { font-size: 11px; color: #8b949e; white-space: nowrap; }
        
        button, select, input[type="file"] { background: #21262d; color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; transition: border-color 0.2s; min-height: 36px; }
        input[type="file"] { max-width: 150px; font-size: 11px; padding: 5px; }
        input[type="file"].dragover { border-color: var(--accent); background: #26354a; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        
        #btn-start { background: var(--success); color: white; border: none; font-weight: bold; }
        #btn-stop { background: var(--danger); color: white; border: none; }
        
        /* 2段目の各要素の伸縮設定 */
        #seek-bar { flex: 1; min-width: 120px; }
        
        .time-display { font-family: monospace; font-size: 12px; color: #8b949e; min-width: 85px; text-align: center; white-space: nowrap; }
        input[type="range"] { -webkit-appearance: none; appearance: none; background: #30363d; height: 6px; border-radius: 3px; outline: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); cursor: pointer; }
        
        .vol-group, .speed-group { display: flex; align-items: center; gap: 4px; }
        .vol-group input[type="range"], .speed-group input[type="range"] { width: 80px; }
        .vol-text, .speed-text { font-family: monospace; font-size: 11px; color: #8b949e; min-width: 35px; }

        #media-preview { height: 32px; max-width: 100px; background: #000; display: none; border-radius: 4px; }
        
        /* 操作系ボタン（コピー・クリア等）の右寄せ */
        .action-group { display: flex; gap: 8px; margin-left: auto; }
        
        /* 文字起こし画面 */
        #log-screen { flex: 1; padding: 20px; overflow-y: auto; font-size: 18px; line-height: 1.6; width: 100%; }
        .block { margin-bottom: 0.8em; border-left: 2px solid var(--accent); padding-left: 12px; min-height: 1.6em; word-break: break-all; transition: background 0.2s; }
        .block:hover { background: #161b22; cursor: text; }
        .block:focus { outline: none; background: #1f242c; border-left-color: #ffad33; border-radius: 0 4px 4px 0; padding-right: 8px; }
        
        .interim-live { color: #8b949e; font-style: italic; border-left: 2px dashed #6e7681; padding-left: 12px; margin-bottom: 0.8em; min-height: 1.6em; word-break: break-all; }
        
        /* ステータスバー */
        .monitor { background: #010409; padding: 10px 20px; border-top: 1px solid var(--border); width: 100%; }
        #status-bar { font-size: 10px; color: #6e7681; display: flex; justify-content: space-between; align-items: center; gap: 10px; }

        /* 全画面ドラッグオーバー時のオーバーレイ */
        #drop-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.85); border: 3px dashed var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: var(--accent); font-weight: bold;
            z-index: 9999; pointer-events: none; opacity: 0; transition: opacity 0.2s;
        }
        body.dragover #drop-overlay { opacity: 1; }

        /* 💻 ウィンドウサイズが狭い（スマホなど）ときの折り返し調整 */
        @media (max-width: 768px) {
            .action-group { margin-left: 0; width: 100%; justify-content: flex-end; }
            .toolbar-row { padding: 8px; gap: 8px; }
        }
    </style>
</head>
<body>

<div id="drop-overlay">ここに音声または動画ファイルをドロップ</div>

<div class="toolbar">
    <div class="toolbar-row top-row">
        <div class="tool-group">
            <label>ファイル:</label>
            <input type="file" id="file-input" accept="audio/*,video/*">
        </div>

        <video id="media-preview"></video>

        <button id="btn-start" disabled>文字起こし開始</button>
        <button id="btn-stop" disabled>一時停止</button>
        
        <div class="action-group">
            <button onclick="copyAll()">コピー</button>
            <button onclick="saveAll()" style="color: var(--accent);">結果保存</button>
            <button onclick="clearAll()" style="color: var(--danger);">クリア</button>
        </div>
    </div>

    <div class="toolbar-row bottom-row">
        <span class="time-display" id="time-show">00:00 / 00:00</span>
        <input type="range" id="seek-bar" value="0" max="100" disabled>
        
        <div class="tool-group speed-group">
            <label>速度:</label>
            <input type="range" id="speed-bar" value="1.0" min="0.5" max="2.0" step="0.1">
            <span class="speed-text" id="speed-show">1.0x</span>
        </div>

        <div class="tool-group vol-group">
            <label>音量:</label>
            <input type="range" id="volume-bar" value="100" min="0" max="100">
            <span class="vol-text" id="volume-show">100%</span>
        </div>

        <div class="tool-group">
            <label style="color: #ffad33; font-weight: bold;">感度ブースト:</label>
            <select id="boost-select" style="padding: 4px 8px; font-size: 11px; border-color: #ffad33; min-height: auto;">
                <option value="1.0" selected>標準 (100%)</option>
                <option value="2.0">200%</option>
                <option value="3.0">300%</option>
                <option value="4.0">400%</option>
                <option value="5.0">500% 🔥</option>
            </select>
        </div>
    </div>
</div>

<div id="log-screen"></div>

<div class="monitor">
    <div id="status-bar">
        <span id="engine-status">ファイルを選択またはドロップしてください</span>
        <span id="mode-status" style="color: var(--accent);">2-ROW LAYOUT + 500% BOOST</span>
    </div>
</div>

<script>
    let recognition = null;
    let isActive = false;
    let restartTimeoutId = null;
    
    let audioCtx = null;
    let sourceNode = null;
    let gainNode = null; 
    let boostNode = null; 
    let destNode = null;

    const fileInput = document.getElementById('file-input');
    const mediaPreview = document.getElementById('media-preview');
    const btnStart = document.getElementById('btn-start');
    const btnStop = document.getElementById('btn-stop');
    const engineStatus = document.getElementById('engine-status');
    
    const seekBar = document.getElementById('seek-bar');
    const timeShow = document.getElementById('time-show');
    const speedBar = document.getElementById('speed-bar');
    const speedShow = document.getElementById('speed-show');
    const volumeBar = document.getElementById('volume-bar');
    const volumeShow = document.getElementById('volume-show');
    const boostSelect = document.getElementById('boost-select');

    function handleFile(file) {
        if (!file) return;
        if (!file.type.startsWith('audio/') && !file.type.startsWith('video/')) {
            alert('音声または動画ファイルを選択してください。');
            return;
        }

        if (isActive) {
            stopTranscribing();
        }

        const fileURL = URL.createObjectURL(file);
        mediaPreview.src = fileURL;
        
        if (file.type.startsWith('video/')) {
            mediaPreview.style.display = 'block';
        } else {
            mediaPreview.style.display = 'none';
        }

        btnStart.disabled = false;
        seekBar.disabled = false;
        seekBar.value = 0;
        engineStatus.innerText = "READY: " + file.name;
    }

    fileInput.onchange = (e) => {
        handleFile(e.target.files[0]);
    };

    window.addEventListener('dragover', (e) => {
        e.preventDefault();
        document.body.classList.add('dragover');
    });

    window.addEventListener('dragleave', (e) => {
        e.preventDefault();
        if (e.clientX === 0 && e.clientY === 0) {
            document.body.classList.remove('dragover');
        }
    });

    window.addEventListener('drop', (e) => {
        e.preventDefault();
        document.body.classList.remove('dragover');
        
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            handleFile(e.dataTransfer.files[0]);
            fileInput.files = e.dataTransfer.files;
        }
    });

    mediaPreview.onloadedmetadata = () => {
        updateTimeDisplay();
    };

    mediaPreview.ontimeupdate = () => {
        if (!mediaPreview.duration) return;
        if (!seekBar.dataset.dragging) {
            const progress = (mediaPreview.currentTime / mediaPreview.duration) * 100;
            seekBar.value = progress;
        }
        updateTimeDisplay();
    };

    seekBar.oninput = () => {
        seekBar.dataset.dragging = "true";
    };

    seekBar.onchange = () => {
        if (!mediaPreview.duration) return;
        const newTime = (seekBar.value / 100) * mediaPreview.duration;
        mediaPreview.currentTime = newTime;
        seekBar.removeAttribute('data-dragging');
        if (isActive) {
            forceResetEngine();
        }
    };

    speedBar.oninput = () => {
        const speedValue = parseFloat(speedBar.value).toFixed(1);
        speedShow.innerText = speedValue + "x";
        mediaPreview.playbackRate = parseFloat(speedValue);
    };

    volumeBar.oninput = () => {
        const volumeValue = volumeBar.value;
        volumeShow.innerText = volumeValue + "%";
        if (gainNode) {
            gainNode.gain.value = parseInt(volumeValue) / 100;
        }
    };

    boostSelect.onchange = () => {
        if (boostNode) {
            boostNode.gain.value = parseFloat(boostSelect.value);
        }
    };

    function formatTime(seconds) {
        if (isNaN(seconds)) return "00:00";
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = Math.floor(seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function updateTimeDisplay() {
        timeShow.innerText = `${formatTime(mediaPreview.currentTime)} / ${formatTime(mediaPreview.duration)}`;
    }

    function initRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            engineStatus.innerText = "非対応ブラウザ";
            return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = true;
        recognition.continuous = true;

        recognition.onstart = () => {
            engineStatus.innerText = "PROCESSING (文字起こし中...)";
        };

        recognition.onresult = (e) => {
            const screen = document.getElementById('log-screen');
            const oldInterim = document.getElementById('interim-live-block');
            if (oldInterim) oldInterim.remove();

            let interimText = '';
            for (let i = e.resultIndex; i < e.results.length; i++) {
                let transcript = e.results[i][0].transcript;
                if (e.results[i].isFinal) {
                    addFinalBlock(transcript);
                } else {
                    interimText += transcript;
                }
            }

            if (interimText) {
                const interimBlock = document.createElement('div');
                interimBlock.id = 'interim-live-block';
                interimBlock.className = 'interim-live';
                interimBlock.innerText = interimText;
                screen.appendChild(interimBlock);
                screen.scrollTop = screen.scrollHeight;
            }
        };

        recognition.onend = () => {
            if (isActive && !mediaPreview.paused && !mediaPreview.ended) {
                clearTimeout(restartTimeoutId);
                restartTimeoutId = setTimeout(() => {
                    if (isActive && recognition) {
                        try { recognition.start(); } catch(err) { forceResetEngine(); }
                    }
                }, 20); 
            }
        };

        recognition.onerror = (ev) => {
            console.warn("認識エラー:", ev.error);
            if (ev.error === 'no-speech' || ev.error === 'audio-capture' || ev.error === 'aborted') {
                try { recognition.stop(); } catch(e){}
            }
        };
    }

    function forceResetEngine() {
        if (recognition) {
            try { recognition.abort(); } catch(e){}
            recognition = null;
        }
        if (isActive) {
            initRecognition();
            try { recognition.start(); } catch(e){}
        }
    }

    mediaPreview.onended = () => {
        if (isActive) {
            stopTranscribing();
            engineStatus.innerText = "完了 (ファイルの終端に達しました)";
        }
    };

    btnStart.onclick = async () => {
        if (!mediaPreview.src) return;

        isActive = true;
        btnStart.disabled = true;
        btnStop.disabled = false;
        fileInput.disabled = true;
        engineStatus.innerText = "CONNECTING";

        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            sourceNode = audioCtx.createMediaElementSource(mediaPreview);
            
            gainNode = audioCtx.createGain();
            gainNode.gain.value = parseInt(volumeBar.value) / 100;

            boostNode = audioCtx.createGain();
            boostNode.gain.value = parseFloat(boostSelect.value);

            destNode = audioCtx.createMediaStreamDestination();
            
            sourceNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            sourceNode.connect(boostNode);
            boostNode.connect(destNode);
        }

        if (!recognition) {
            initRecognition();
        }

        try {
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
            mediaPreview.playbackRate = parseFloat(speedBar.value);
            recognition.start();
            mediaPreview.play(); 
        } catch (e) {
            console.error(e);
            forceResetEngine();
        }
    };

    btnStop.onclick = () => {
        stopTranscribing();
        engineStatus.innerText = "PAUSED (一時停止中)";
    };

    function stopTranscribing() {
        isActive = false;
        clearTimeout(restartTimeoutId);
        btnStart.disabled = false;
        btnStop.disabled = true;
        fileInput.disabled = false;
        mediaPreview.pause(); 

        const oldInterim = document.getElementById('interim-live-block');
        if (oldInterim) oldInterim.remove();

        if (recognition) {
            try { recognition.stop(); } catch(e){}
        }
    }

    function addFinalBlock(text) {
        let cleanedText = text.trim();
        if (!cleanedText) return;

        const fillerRegex = /^(えーと|えーっと|えー、|あのー|あの、|えー|あの|まー|うーん)/g;
        cleanedText = cleanedText.replace(fillerRegex, "").replace(/[、\s](えーと|えーっと|えー、|あのー|あの、|えー|あの)[、\s]?/g, " ").trim();
        if (cleanedText === "") return;

        const screen = document.getElementById('log-screen');
        if (screen.lastElementChild && (screen.lastElementChild.innerText === cleanedText || screen.lastElementChild.innerText === cleanedText + "。")) return;

        const newBlock = document.createElement('div');
        newBlock.className = 'block';

        const hasPunctuation = /[。？！\?\!]$/.test(cleanedText);
        newBlock.innerText = cleanedText + (hasPunctuation ? "" : "。");
        
        newBlock.onclick = function() {
            if (this.getAttribute('contenteditable') !== 'true') {
                this.setAttribute('contenteditable', 'true');
                this.focus();
            }
        };

        newBlock.onblur = function() {
            this.removeAttribute('contenteditable');
            this.innerText = this.innerText.trim();
            if (this.innerText === "") {
                this.remove();
            }
        };

        newBlock.onkeydown = function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                this.blur();
            }
        };
        
        screen.appendChild(newBlock);
        requestAnimationFrame(() => { screen.scrollTop = screen.scrollHeight; });
    }

    function clearAll() { 
        if(!confirm("ログを削除しますか？")) return;
        document.getElementById('log-screen').innerHTML = ''; 
    }
    
    function copyAll() {
        const text = Array.from(document.querySelectorAll('#log-screen .block')).map(b => b.innerText).join('\n');
        if (!text) return;
        navigator.clipboard.writeText(text).then(() => {
            const originalText = engineStatus.innerText;
            engineStatus.innerText = "COPIED!";
            setTimeout(() => engineStatus.innerText = originalText, 1500);
        });
    }

    function saveAll() {
        const text = Array.from(document.querySelectorAll('#log-screen .block')).map(b => b.innerText).join('\n');
        if (!text) {
            alert("保存するテキストがありません。");
            return;
        }
        const blob = new Blob([text], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'file_transcribe_log.txt';
        a.click();
        URL.revokeObjectURL(a.href);
    }
</script>
</body>
</html>
